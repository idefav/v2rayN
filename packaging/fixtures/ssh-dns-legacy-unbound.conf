server:
    interface: 127.0.0.1
    port: 53
    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    username: ""
    chroot: ""
    directory: "/var/lib/ssh-egress-dns"
    pidfile: ""
    use-syslog: no
    verbosity: 1
    log-queries: no
    hide-identity: yes
    hide-version: yes
    num-threads: 1
    msg-cache-size: 16m
    rrset-cache-size: 32m
    edns-buffer-size: 1232
    prefetch: yes
    qname-minimisation: yes
    module-config: "validator iterator"
    auto-trust-anchor-file: "/var/lib/ssh-egress-dns/root.key"
    root-hints: "/opt/ssh-egress-dns/root/usr/share/dns/root.hints"

# Preserve the observed Alibaba Cloud infrastructure's private resolution.
# All other zones use iterative recursion; there is no global forward-zone.
forward-zone:
    name: "cloud.aliyuncs.com."
    forward-addr: 100.100.2.136
    forward-addr: 100.100.2.138
    forward-first: no

forward-zone:
    name: "aegis.aliyun.com."
    forward-addr: 100.100.2.136
    forward-addr: 100.100.2.138
    forward-first: no
