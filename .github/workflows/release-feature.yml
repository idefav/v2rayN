name: release SSH feature preview

on:
  push:
    tags:
      - 'v*-ssh-preview.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing preview tag pointing to the selected ref
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ssh-preview-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      core_ref: ${{ steps.metadata.outputs.core_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate source and resolve core bundle
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' v2rayN/Directory.Build.props)
          [[ "$RELEASE_TAG" == "v${version}-ssh-preview."* ]]
          sequence=${RELEASE_TAG#"v${version}-ssh-preview."}
          [[ "$sequence" =~ ^[1-9][0-9]*$ ]]
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$GITHUB_SHA" ]]
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/feature/native-ssh-profiles &&
             ! git merge-base --is-ancestor "$GITHUB_SHA" origin/feature/precise-egress-observer; then
            git merge-base --is-ancestor "$GITHUB_SHA" "origin/release/$version"
          fi
          core_ref=$(gh api repos/2dust/v2rayN-core-bin/commits/master --jq .sha)
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "core_ref=$core_ref" >> "$GITHUB_OUTPUT"

  test:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.1xx
      - name: Prepare isolated SSH integration fixtures
        env:
          CORE_BIN_REF: ${{ needs.validate.outputs.core_ref }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ssh-python"
          "$RUNNER_TEMP/ssh-python/bin/pip" install paramiko
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/core.zip" \
            "https://raw.githubusercontent.com/2dust/v2rayN-core-bin/$CORE_BIN_REF/v2rayN-linux-64.zip"
          unzip -q "$RUNNER_TEMP/core.zip" 'v2rayN-linux-64/bin/sing_box/*' -d "$RUNNER_TEMP/core"
          core="$RUNNER_TEMP/core/v2rayN-linux-64/bin/sing_box/sing-box"
          chmod +x "$core"
          "$core" version
          docker build -t v2rayn-ssh-test v2rayN/ServiceLib.Tests/Fixtures/openssh-key-setup
          echo "SSH_TEST_PYTHON=$RUNNER_TEMP/ssh-python/bin/python" >> "$GITHUB_ENV"
          echo "SSH_TEST_SINGBOX=$core" >> "$GITHUB_ENV"
          echo "V2RAYN_UPDATE_TEST_CORE=$core" >> "$GITHUB_ENV"
          echo 'SSH_SETUP_DOCKER_IMAGE=v2rayn-ssh-test' >> "$GITHUB_ENV"
      - name: Run unit and SSH integration tests
        run: dotnet test --project ./v2rayN/ServiceLib.Tests -c Release --results-directory ./TestResults -- --report-trx
      - name: Verify Primer designs and native page coverage
        run: |
          node docs/design/main-primer-opendesign/tests/prototype-check.cjs
          node docs/design/main-primer-opendesign/tests/secondary-pages-check.cjs
          node docs/design/main-primer-opendesign/tests/native-coverage-check.cjs
      - name: Review desktop controls with Skia
        run: |
          dotnet build v2rayN/v2rayN.Desktop.Review -c Release -p:UsedAvaloniaProducts=
          dotnet v2rayN/v2rayN.Desktop.Review/bin/Release/net10.0/v2rayN.Desktop.Review.dll artifacts/preview-ui/zh-light --primer-only --headless --language=zh-Hans --theme=light --width=1440
          dotnet v2rayN/v2rayN.Desktop.Review/bin/Release/net10.0/v2rayN.Desktop.Review.dll artifacts/preview-ui/en-dark --primer-only --headless --language=en --theme=dark --width=600
          dotnet v2rayN/v2rayN.Desktop.Review/bin/Release/net10.0/v2rayN.Desktop.Review.dll artifacts/preview-ui/sources-zh --update-sources-only --headless --language=zh-Hans --theme=light --width=1200
          dotnet v2rayN/v2rayN.Desktop.Review/bin/Release/net10.0/v2rayN.Desktop.Review.dll artifacts/preview-ui/sources-en --update-sources-only --headless --language=en --theme=dark --width=980
          dotnet v2rayN/v2rayN.Desktop.Review/bin/Release/net10.0/v2rayN.Desktop.Review.dll artifacts/preview-ui/egress-zh --proxy-check-only --headless --language=zh-Hans --theme=light --width=1440
          dotnet v2rayN/v2rayN.Desktop.Review/bin/Release/net10.0/v2rayN.Desktop.Review.dll artifacts/preview-ui/egress-en --proxy-check-only --headless --language=en --theme=dark --width=600
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-test-results
          path: |
            TestResults
            artifacts/preview-ui

  native-ui:
    needs: validate
    uses: ./.github/workflows/native-macos-review.yml

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            platform: windows
            project: ./v2rayN/v2rayN.csproj
          - target: windows-desktop
            platform: windows
            project: ./v2rayN.Desktop/v2rayN.Desktop.csproj
          - target: linux
            platform: linux
            project: ./v2rayN.Desktop/v2rayN.Desktop.csproj
          - target: macos
            platform: macos
            project: ./v2rayN.Desktop/v2rayN.Desktop.csproj
    uses: ./.github/workflows/build.yml
    with:
      target: ${{ matrix.platform }}
      project: ${{ matrix.project }}
      artifact_prefix: preview-build-${{ matrix.target }}-
      release_tag: ${{ needs.validate.outputs.tag }}

  package-zip:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [windows, windows-desktop, linux, macos]
        arch: [x64, arm64]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: preview-build-${{ matrix.target }}-${{ matrix.arch }}
          path: publish
      - name: Package app with pinned cores
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          CORE_BIN_REF: ${{ needs.validate.outputs.core_ref }}
        run: |
          set -euo pipefail
          platform=${TARGET%-desktop}
          arch=$ARCH
          [[ "$arch" != x64 ]] || arch=64
          root="v2rayN-$platform-$arch"
          name=$root
          [[ "$TARGET" != windows-desktop ]] || name="$name-desktop"
          curl --fail --location --retry 3 -o core.zip \
            "https://raw.githubusercontent.com/2dust/v2rayN-core-bin/$CORE_BIN_REF/$root.zip"
          unzip -q core.zip
          cp -R publish/. "$root/"
          if [[ "$platform" != windows ]]; then
            chmod +x "$root/v2rayN" "$root/AmazTool"
            chmod +x "$root/proxy-check"
            chmod -R +x "$root/bin"
          fi
          mkdir dist
          7z a -tzip "dist/$name.zip" "$root" -mx1
          7z t "dist/$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: preview-package-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  package-dmg:
    needs: [validate, build]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: preview-build-macos-${{ matrix.arch }}
          path: publish
      - name: Install packaging tools
        run: brew install create-dmg sevenzip
      - name: Package DMG
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.validate.outputs.version }}
          CORE_BIN_REF: ${{ needs.validate.outputs.core_ref }}
        run: |
          set -euo pipefail
          arch=$ARCH
          [[ "$arch" != x64 ]] || arch=64
          bash package-osx.sh "macos-$arch" publish "$VERSION"
          hdiutil verify "v2rayN-macos-$arch.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: preview-package-dmg-${{ matrix.arch }}
          path: v2rayN*.dmg
          if-no-files-found: error

  release:
    needs: [validate, test, native-ui, package-zip, package-dmg]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: preview-package-*
          merge-multiple: true
          path: dist
      - name: Verify complete asset set and generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          for arch in 64 arm64; do
            for platform in windows linux macos; do
              test -s "v2rayN-$platform-$arch.zip"
            done
            test -s "v2rayN-windows-$arch-desktop.zip"
            test -s "v2rayN-macos-$arch.dmg"
          done
          [[ $(find . -maxdepth 1 -type f | wc -l) -eq 10 ]]
          sha256sum *.zip *.dmg > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish preview after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          CORE_BIN_REF: ${{ needs.validate.outputs.core_ref }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          SSH 测试版，构建来源：\`$GITHUB_REF_NAME\`。

          - 原生 SSH 节点：密码、私钥及加密私钥认证。
          - 共用 SSH 密钥选择、一键配置免密登录。
          - 编辑器内分别测试 SSH 登录与代理访问。
          - Avalonia 全界面换新：节点工作区、固定操作列、分组与订阅、设置及编辑器。
          - 当前代理按单节点／策略组展示；新增独立出口 IP、地区与国旗检测，支持自动和手动检查。
          - 活动节点整行持续高亮，顶部运行摘要新增出口地区与检测状态，悬停查看 IP 和检测详情。
          - 出口检测不切换活动服务器，不修改系统代理、TUN 或路由；自动检测可在设置关闭。
          - macOS 启动、休眠唤醒与网络变化后自动检查当前连接；先修复系统代理，仅确认本地核心或 SOCKS 故障才重启，外部探测失败保留连接。
          - 自动恢复包含事件合并、重启限频及退出取消；适用于关闭 TUN、自动配置系统代理且未使用自定义代理脚本的配置。
          - 修复局域网 .local 域名解析：macOS 使用系统 mDNS，连接在全局模式下也走局域网直连，兼容末尾句点，避免公共 DNS 返回 NXDOMAIN 刷屏。
          - 新增 Avalonia“代理检查”：区分系统路径、HTTP CONNECT、SOCKS5 与普通套接字，验证 TCP/TLS、DNS、STUN 普通 UDP、真实 HTTP3 和 IPv4/IPv6；支持预期出口、基线及 JSON 报告。
          - 新增独立出口观察服务接入：验证服务端签名证据，分别展示通信、实际出口与预期比较；控制接口成功不等于各协议已验证。
          - 代理检查的实际出口 IP 自动补充国家、地区与城市，支持 IPv4/IPv6、多地址及查询缓存；第三方地域信息独立于签名证据，查询失败不影响检测结论。
          - 代理检查分类默认折叠，保留完成进度和异常计数；固定 HTTP CONNECT/UDP 限制移入独立路径能力说明，不再计入检测任务。路径名称区分 TUN 开启/关闭，多预期 IP 按“任意一个匹配”提示。
          - 独立探测服务支持域名加一次性配对串，控制接口使用 mTLS，设备凭证保存到系统安全存储；旧 API Key 不再支持。
          - 新增真实浏览器 WebRTC 数据通道出口检查、DNS 按节点及分流规则选择出口、代理 UDP 与 QUIC 阻断选项。
          - 配置服务与高级检查选项在独立弹窗打开；修复配对取消、并发解绑、会话撤销及 DNS 签名证据校验。
          - 主工作区与代理检查采用统一 Primer 布局，支持中英文、浅深主题和窄窗；明确区分选中节点、运行节点与缓存出口。
          - 修复取消进度、通过筛选、观察端状态失效、停止内核说明及大字号关于窗口；补齐次级页面与动态页面设计，原生接入进度见设计覆盖清单。
          - macOS 锁屏或显示会话不可用时延后原生 UI 初始化，避免启动阶段的 CoreVideo RenderTimer -6661；原生 AppKit 窗口双主题验收现为发布必需门禁。
          - SSH 节点新增默认关闭的 UDP over SSH 与允许 HTTP3 选项；使用 idefav/sing-box 固定提交构建专用核心，远端需要 OpenSSH UDP 扩展，失败不回退直连。
          - 新增“更新与资源来源”：v2rayN、Xray、mihomo、sing-box 及 Geo、SRS、路由模板可自定义来源，支持单项和全部恢复默认，保存来源不会重启代理。
          - 显式安装的核心更新优先于随包专用核心；验证版本、SHA-256 和当前配置，启动失败恢复旧核心。更新页面区分更新来源与已安装来源，支持手动切换仓库。
          - macOS 安装盘保留可复制的拦截处理命令与安装说明。服务器独立端口部署、中继迁移、协议与排障记录见下方部署文档。
          - Windows WPF / Avalonia、Linux、macOS：x64 / arm64 ZIP；macOS 另有 DMG。
          - 安装包包含运行时及代理核心；\`SHA256SUMS\` 用于校验下载文件。
          - 此版本未配置 GPG 发布签名，macOS 包未经 Apple 开发者签名及公证。

          源码提交：\`$GITHUB_SHA\`
          核心包提交：\`$CORE_BIN_REF\`（2dust/v2rayN-core-bin）
          验证：单元测试、隔离 SSH 集成测试、全部平台编译与包完整性检查。
          macOS 本地已验证原生唤醒通知与 SSH 静默卡住恢复；真实休眠、整夜休眠及整机重启需安装后验收。

          [SSH 使用说明](https://github.com/$GH_REPO/blob/$RELEASE_TAG/docs/ssh-key-setup.zh-Hans.md)
          · [UI 与出口检测说明](https://github.com/$GH_REPO/blob/$RELEASE_TAG/docs/exit-info-preview.zh-Hans.md)
          · [macOS 网络恢复说明](https://github.com/$GH_REPO/blob/$RELEASE_TAG/docs/macos-network-recovery.md)
          · [SSH UDP 服务部署与扩展记录](https://github.com/$GH_REPO/blob/$RELEASE_TAG/docs/ssh-udp-deployment.zh-Hans.md)
          · [更新与资源来源说明](https://github.com/$GH_REPO/blob/$RELEASE_TAG/docs/update-sources.zh-Hans.md)
          · [Primer 页面设计与实施范围](https://github.com/$GH_REPO/blob/$RELEASE_TAG/docs/design/page-coverage.md)
          · [macOS 原生启动与验收](https://github.com/$GH_REPO/blob/$RELEASE_TAG/docs/macos-native-rendering.zh-Hans.md)
          · [探测服务部署与端口](https://github.com/idefav/egress-probe#deploy-on-linux)
          · [客户端域名配对](https://github.com/$GH_REPO/blob/$RELEASE_TAG/docs/observer-pairing.md)
          · [构建记录](https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID)
          EOF
          # A failed upload may leave a draft; never overwrite a published release.
          if gh release view "$RELEASE_TAG" --json isDraft > existing.json 2>/dev/null; then
            jq -e '.isDraft == true' existing.json
            gh release edit "$RELEASE_TAG" --notes-file notes.md --prerelease --latest=false
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --latest=false \
              --title "$RELEASE_TAG — SSH 测试版" --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          [[ $(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length') -eq 11 ]]
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
