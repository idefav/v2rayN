name: release SSH feature preview

on:
  push:
    tags:
      - 'v*-ssh-preview.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing preview tag pointing to the selected ref
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ssh-preview-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      core_ref: ${{ steps.metadata.outputs.core_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate source and resolve core bundle
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' v2rayN/Directory.Build.props)
          [[ "$RELEASE_TAG" == "v${version}-ssh-preview."* ]]
          sequence=${RELEASE_TAG#"v${version}-ssh-preview."}
          [[ "$sequence" =~ ^[1-9][0-9]*$ ]]
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$GITHUB_SHA" ]]
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/feature/native-ssh-profiles &&
             ! git merge-base --is-ancestor "$GITHUB_SHA" origin/feature/precise-egress-observer; then
            git merge-base --is-ancestor "$GITHUB_SHA" "origin/release/$version"
          fi
          core_ref=$(gh api repos/2dust/v2rayN-core-bin/commits/master --jq .sha)
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "core_ref=$core_ref" >> "$GITHUB_OUTPUT"

  test:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.1xx
      - name: Prepare isolated SSH integration fixtures
        env:
          CORE_BIN_REF: ${{ needs.validate.outputs.core_ref }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ssh-python"
          "$RUNNER_TEMP/ssh-python/bin/pip" install paramiko
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/core.zip" \
            "https://raw.githubusercontent.com/2dust/v2rayN-core-bin/$CORE_BIN_REF/v2rayN-linux-64.zip"
          unzip -q "$RUNNER_TEMP/core.zip" 'v2rayN-linux-64/bin/sing_box/*' -d "$RUNNER_TEMP/core"
          core="$RUNNER_TEMP/core/v2rayN-linux-64/bin/sing_box/sing-box"
          chmod +x "$core"
          "$core" version
          docker build -t v2rayn-ssh-test v2rayN/ServiceLib.Tests/Fixtures/openssh-key-setup
          echo "SSH_TEST_PYTHON=$RUNNER_TEMP/ssh-python/bin/python" >> "$GITHUB_ENV"
          echo "SSH_TEST_SINGBOX=$core" >> "$GITHUB_ENV"
          echo "V2RAYN_UPDATE_TEST_CORE=$core" >> "$GITHUB_ENV"
          echo 'SSH_SETUP_DOCKER_IMAGE=v2rayn-ssh-test' >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version-file: proxy-check/go.mod
          cache-dependency-path: proxy-check/go.sum
      - name: Build the bundled core for TUN configuration checks
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/tun-core/sing-box"
          bash packaging/build-ssh-core.sh linux amd64 "$core"
          "$core" version
          echo "TUN_TEST_SINGBOX=$core" >> "$GITHUB_ENV"
      - name: Run unit and SSH integration tests
        run: dotnet test --project ./v2rayN/ServiceLib.Tests -c Release --results-directory ./TestResults -- --report-trx
      - name: Verify Primer designs and native page coverage
        run: |
          node docs/design/main-primer-opendesign/tests/prototype-check.cjs
          node docs/design/main-primer-opendesign/tests/secondary-pages-check.cjs
          node docs/design/main-primer-opendesign/tests/native-coverage-check.cjs
          node docs/design/tun-settings-opendesign/tests/prototype-check.cjs
      - name: Review desktop controls with Skia
        run: |
          dotnet build v2rayN/v2rayN.Desktop.Review -c Release -p:UsedAvaloniaProducts=
          dotnet v2rayN/v2rayN.Desktop.Review/bin/Release/net10.0/v2rayN.Desktop.Review.dll artifacts/preview-ui/workspace-v3 --workspace-v3-only --headless
          dotnet v2rayN/v2rayN.Desktop.Review/bin/Release/net10.0/v2rayN.Desktop.Review.dll artifacts/preview-ui/zh-light --primer-only --headless --language=zh-Hans --theme=light --width=1440
          dotnet v2rayN/v2rayN.Desktop.Review/bin/Release/net10.0/v2rayN.Desktop.Review.dll artifacts/preview-ui/en-dark --primer-only --headless --language=en --theme=dark --width=800
          dotnet v2rayN/v2rayN.Desktop.Review/bin/Release/net10.0/v2rayN.Desktop.Review.dll artifacts/preview-ui/sources-zh --update-sources-only --headless --language=zh-Hans --theme=light --width=1200
          dotnet v2rayN/v2rayN.Desktop.Review/bin/Release/net10.0/v2rayN.Desktop.Review.dll artifacts/preview-ui/sources-en --update-sources-only --headless --language=en --theme=dark --width=980
          dotnet v2rayN/v2rayN.Desktop.Review/bin/Release/net10.0/v2rayN.Desktop.Review.dll artifacts/preview-ui/egress-zh --proxy-check-only --headless --language=zh-Hans --theme=light --width=1440
          dotnet v2rayN/v2rayN.Desktop.Review/bin/Release/net10.0/v2rayN.Desktop.Review.dll artifacts/preview-ui/egress-en --proxy-check-only --headless --language=en --theme=dark --width=800
          dotnet v2rayN/v2rayN.Desktop.Review/bin/Release/net10.0/v2rayN.Desktop.Review.dll artifacts/preview-ui/tun-zh --tun-settings-only --headless --language=zh-Hans --theme=light --width=1440
          dotnet v2rayN/v2rayN.Desktop.Review/bin/Release/net10.0/v2rayN.Desktop.Review.dll artifacts/preview-ui/tun-en --tun-settings-only --headless --language=en --theme=dark --width=600
          dotnet v2rayN/v2rayN.Desktop.Review/bin/Release/net10.0/v2rayN.Desktop.Review.dll artifacts/preview-ui/ssh-udp-zh --ssh-udp-only --headless --language=zh-Hans --theme=light --width=1000
          dotnet v2rayN/v2rayN.Desktop.Review/bin/Release/net10.0/v2rayN.Desktop.Review.dll artifacts/preview-ui/ssh-udp-en --ssh-udp-only --headless --language=en --theme=dark --width=1000
      - name: Verify review failures return a failing exit code
        shell: bash
        run: |
          result=0
          dotnet v2rayN/v2rayN.Desktop.Review/bin/Release/net10.0/v2rayN.Desktop.Review.dll artifacts/preview-ui/expected-failure --headless --verify-failure-exit || result=$?
          test "$result" -eq 1
          test -f artifacts/preview-ui/expected-failure/failure.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-test-results
          path: |
            TestResults
            artifacts/preview-ui

  native-ui:
    needs: validate
    uses: ./.github/workflows/native-macos-review.yml

  listener-bind:
    needs: validate
    uses: ./.github/workflows/core-process-lifecycle.yml
    with:
      bind_only: true

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            platform: windows
            project: ./v2rayN/v2rayN.csproj
          - target: windows-desktop
            platform: windows
            project: ./v2rayN.Desktop/v2rayN.Desktop.csproj
          - target: linux
            platform: linux
            project: ./v2rayN.Desktop/v2rayN.Desktop.csproj
          - target: macos
            platform: macos
            project: ./v2rayN.Desktop/v2rayN.Desktop.csproj
    uses: ./.github/workflows/build.yml
    with:
      target: ${{ matrix.platform }}
      project: ${{ matrix.project }}
      artifact_prefix: preview-build-${{ matrix.target }}-
      release_tag: ${{ needs.validate.outputs.tag }}

  package-zip:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [windows, windows-desktop, linux, macos]
        arch: [x64, arm64]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: preview-build-${{ matrix.target }}-${{ matrix.arch }}
          path: publish
      - name: Package app with pinned cores
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          CORE_BIN_REF: ${{ needs.validate.outputs.core_ref }}
        run: |
          set -euo pipefail
          platform=${TARGET%-desktop}
          arch=$ARCH
          [[ "$arch" != x64 ]] || arch=64
          root="v2rayN-$platform-$arch"
          name=$root
          [[ "$TARGET" != windows-desktop ]] || name="$name-desktop"
          curl --fail --location --retry 3 -o core.zip \
            "https://raw.githubusercontent.com/2dust/v2rayN-core-bin/$CORE_BIN_REF/$root.zip"
          unzip -q core.zip
          cp -R publish/. "$root/"
          rm -f "$root/AmazTool" "$root/AmazTool.exe"
          if [[ "$platform" == windows ]]; then
            test -f "$root/AmazToolV2.exe"
          else
            test -f "$root/AmazToolV2"
          fi
          if [[ "$platform" != windows ]]; then
            chmod +x "$root/v2rayN" "$root/AmazToolV2"
            chmod +x "$root/proxy-check"
            chmod -R +x "$root/bin"
          fi
          mkdir dist
          7z a -tzip "dist/$name.zip" "$root" -mx1
          7z t "dist/$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: preview-package-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  package-dmg:
    needs: [validate, build]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: preview-build-macos-${{ matrix.arch }}
          path: publish
      - name: Install packaging tools
        run: brew install create-dmg sevenzip
      - name: Package DMG
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.validate.outputs.version }}
          CORE_BIN_REF: ${{ needs.validate.outputs.core_ref }}
        run: |
          set -euo pipefail
          arch=$ARCH
          [[ "$arch" != x64 ]] || arch=64
          bash package-osx.sh "macos-$arch" publish "$VERSION"
          hdiutil verify "v2rayN-macos-$arch.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: preview-package-dmg-${{ matrix.arch }}
          path: v2rayN*.dmg
          if-no-files-found: error

  macos-upgrade-tun:
    needs: package-zip
    uses: ./.github/workflows/macos-upgrade-tun.yml
    with:
      candidate_artifact: preview-package-macos-arm64

  release:
    needs: [validate, test, native-ui, listener-bind, package-zip, package-dmg, macos-upgrade-tun]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: preview-package-*
          merge-multiple: true
          path: dist
      - name: Verify complete asset set and generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          for arch in 64 arm64; do
            for platform in windows linux macos; do
              test -s "v2rayN-$platform-$arch.zip"
            done
            test -s "v2rayN-windows-$arch-desktop.zip"
            test -s "v2rayN-macos-$arch.dmg"
          done
          [[ $(find . -maxdepth 1 -type f | wc -l) -eq 10 ]]
          sha256sum *.zip *.dmg > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish preview after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          CORE_BIN_REF: ${{ needs.validate.outputs.core_ref }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          SSH 测试版，构建来源：\`$GITHUB_REF_NAME\`。

          - 连接首页改为紧凑的独立小窗口，配置管理在独立大窗口中打开；保留原有服务器、订阅、路由、诊断、更新和应用设置功能。
          - 更换服务器时向右展开带动画的抽屉，默认定位并标记已选节点；搜索、收藏、手动滚动和收起不触发连接操作。
          - 连接进度改为不抢焦点的非模态提示，成功后自动收起，可查看详情、取消和重试；按钮配色与实际运行模式一致，用户选择和运行状态分别显示。
          - 全平台替换为新的应用图标，macOS 菜单栏以独立的 P/T 彩色标识显示实际系统代理与 TUN 状态，保留快捷菜单操作。
          - 修复退出清理与重载并发：正常退出等待主／前置内核停止，退出期间阻止新内核启动；保存或代理清理失败仍继续执行有界内核清理。
          - macOS 从已确认归属的提权 TUN 内核切换为普通模式时，按真实绑定结果等待原端口交接，最多 90 秒且可取消；不自动改端口、不重新开启 TUN、不终止未知进程。
          - 断开连接后保留所选模式和节点，内核更新不擅自重新连接；实时速度开关、设置草稿及未保存离开行为均有回归覆盖。
          - 新增新版首页、授权窗口、彩色菜单栏、选服定位与提示收起的 Headless／原生窗口门禁；测试程序的失败退出码也纳入发布检查。
          - 修复 macOS 开启 TUN 后界面死锁：内核状态查询全链路异步等待，移除界面线程同步等待提权进程查询的入口；DNS、代理检查、规则更新和自动恢复一并使用异步状态查询。
          - 新增真实 Avalonia 界面线程回归，覆盖主／前置进程、界面心跳、身份不匹配、取消及退出；发布前同时运行隔离的真实 root TUN 和旧版升级验收。
          - 修复单文件下载失败被误报为完成的问题，界面显示 HTTP 状态、下载地址、直连／代理方式及尝试次数；临时网络错误最多尝试三次，取消即停止并清理不完整文件。
          - GitHub 常规下载入口遇到临时错误时，在重试中使用同仓库、同资产的官方 API 下载入口，保持原代理方式；下载完成后核验发布资产大小和可用的 SHA-256 摘要，校验失败不安装。
          - 新增真实 GitHub 发布 ZIP 下载门禁，使用生产下载代码核验 SHA-256 和包结构；覆盖瞬时失败恢复、持续 504、404、429、取消和截断下载。网关持续不可用时仍会明确报错，不把重试视为网络已修复。
          - 原生 SSH 节点：密码、私钥及加密私钥认证。
          - 共用 SSH 密钥选择、一键配置免密登录。
          - 编辑器内分别测试 SSH 登录与代理访问。
          - Avalonia 全界面换新：节点工作区、固定操作列、分组与订阅、设置及编辑器。
          - 当前代理按单节点／策略组展示；新增独立出口 IP、地区与国旗检测，支持自动和手动检查。
          - 活动节点整行持续高亮，顶部运行摘要新增出口地区与检测状态，悬停查看 IP 和检测详情。
          - 出口检测不切换活动服务器，不修改系统代理、TUN 或路由；自动检测可在设置关闭。
          - macOS 启动、休眠唤醒与网络变化后自动检查当前连接；先修复系统代理，仅确认本地核心或 SOCKS 故障才重启，外部探测失败保留连接。
          - 自动恢复包含事件合并、重启限频及退出取消；适用于关闭 TUN、自动配置系统代理且未使用自定义代理脚本的配置。
          - 修复 sing-box 重启时旧进程残留导致的端口冲突：核验进程身份并等待主／前置内核及子进程退出，停止失败保留记录并中止启动；监听冲突显示占用信息，未知进程只提示，启动失败清理本次实例。
          - 修复 Linux 将 .NET 与 ps 启动时间差异误判为进程身份变化：统一使用内核原始启动刻度，覆盖提权报告、存活检查、停止重试及连续重启，保持严格的 PID 复用保护。
          - 补充真实端口绑定检查，阻止“已绑定但未监听”漏检；区分监听占用与尚不可绑定状态，失败不启动内核、不替换配置。提权检查使用与内核一致的权限，覆盖 macOS 跨 UID 的 TIME_WAIT；Linux、macOS、Windows 绑定回归通过后才发布测试包。
          - 新增真实进程树、监听释放和 30 次连续重启回归；macOS 提权／真实 TUN 及 Linux、Windows 实机验收结果单独记录，普通进程测试不代替实机验证。
          - 修复局域网 .local 域名解析：macOS 使用系统 mDNS，连接在全局模式下也走局域网直连，兼容末尾句点，避免公共 DNS 返回 NXDOMAIN 刷屏。
          - 新增 Avalonia“代理检查”：区分系统路径、HTTP CONNECT、SOCKS5 与普通套接字，验证 TCP/TLS、DNS、STUN 普通 UDP、真实 HTTP3 和 IPv4/IPv6；支持预期出口、基线及 JSON 报告。
          - 新增独立出口观察服务接入：验证服务端签名证据，分别展示通信、实际出口与预期比较；控制接口成功不等于各协议已验证。
          - 代理检查的实际出口 IP 自动补充国家、地区与城市，支持 IPv4/IPv6、多地址及查询缓存；第三方地域信息独立于签名证据，查询失败不影响检测结论。
          - 代理检查分类默认折叠，保留完成进度和异常计数；固定 HTTP CONNECT/UDP 限制移入独立路径能力说明，不再计入检测任务。路径名称区分 TUN 开启/关闭，多预期 IP 按“任意一个匹配”提示。
          - 实际出口逐 IP 展示国旗、地域与独立匹配结果；预期地域支持国家/地区搜索、多选，不影响原有 IP 判定、通过/失败计数或重试资格。
          - 新增 Avalonia 独立 TUN 设置页：DNS 接管、UDP NAT、捕获范围与规则集、多地址、设备名和 Linux 高级接管，提供预设、平台联动及可搜索导出的中英文离线说明。
          - TUN 设置按 Local Codex 原稿重排编号导航、三列布局、DNS 自动/自定义入口、帮助抽屉和固定底栏；恢复本组默认保留规则集库，取消修改先确认，补齐双主题原生 AppKit 发布检查。
          - TUN 设置保存前检查实际内核配置，失败保留草稿并尝试恢复原配置；保存不会自动开启 TUN，有效配置未变化时保留连接。真实接管仍需在对应系统验证。
          - 独立探测服务支持域名加一次性配对串，控制接口使用 mTLS，设备凭证保存到系统安全存储；旧 API Key 不再支持。
          - 新增真实浏览器 WebRTC 数据通道出口检查、DNS 按节点及分流规则选择出口、代理 UDP 与 QUIC 阻断选项。
          - 配置服务与高级检查选项在独立弹窗打开；修复配对取消、并发解绑、会话撤销及 DNS 签名证据校验。
          - 主工作区与代理检查采用统一 Primer 布局，支持中英文、浅深主题和窄窗；明确区分选中节点、运行节点与缓存出口。
          - 修复取消进度、通过筛选、观察端状态失效、停止内核说明及大字号关于窗口；补齐次级页面与动态页面设计，原生接入进度见设计覆盖清单。
          - macOS 锁屏或显示会话不可用时延后原生 UI 初始化，避免启动阶段的 CoreVideo RenderTimer -6661；原生 AppKit 窗口双主题验收现为发布必需门禁。
          - SSH UDP 支持自定义扩展与 tun2proxy 网关两种模式，配套 sing-box 1.14.3-ssh-udp.3；保留旧节点模式，失败不切换协议、不回退直连。
          - SSH 编辑器按真实协议检测能力并显示禁选原因，凭据或公钥变化使旧结果失效；网关心跳与 UDP 数据可用性分别验证。
          - 新增 Linux x86_64/ARM64、systemd、root/sudo 的 tun2proxy 0.8.7 网关自动部署：固定摘要、固定公钥 SFTP、回环监听、自动选端口、随机令牌 UDP 回显和持久事务回滚；只回填草稿，当前代理继续运行。
          - 修复独立代理 sshd 使用 AllowUdpForwarding/PidFile 启动参数时网关部署误报 E_SSHD_COMMAND_AMBIGUOUS；保留节点代理 SSH 端口及生效参数，已通过真实中继链路安装与 UDP、DNS、HTTP3 验证。
          - 修改版 OpenSSH 的 ForwardProxy 需要配套精确网关例外；旧版本提示升级，不自动替换 sshd。网关 UDP 使用服务器本机出口。自定义模式需要配套 UDP 扩展。
          - 每个 SSH UDP 出站最多 64 个关联、4 个并发建立任务；修复多目标关联、超时故障隔离和排队取消竞态。Windows 实机、系统 TUN 与公网协议路径仍须独立验收。
          - 新增“更新与资源来源”：v2rayN、Xray、mihomo、sing-box 及 Geo、SRS、路由模板可自定义来源，支持单项和全部恢复默认，保存来源不会重启代理。
          - 显式安装的核心更新优先于随包专用核心；验证版本、SHA-256 和当前配置，启动失败恢复旧核心。更新页面区分更新来源与已安装来源，支持手动切换仓库。
          - macOS 安装盘保留可复制的拦截处理命令与安装说明。服务器独立端口部署、中继迁移、协议与排障记录见下方部署文档。
          - Windows WPF / Avalonia、Linux、macOS：x64 / arm64 ZIP；macOS 另有 DMG。
          - 安装包包含运行时及代理核心；\`SHA256SUMS\` 用于校验下载文件。
          - 此版本未配置 GPG 发布签名，macOS 包未经 Apple 开发者签名及公证。

          源码提交：\`$GITHUB_SHA\`
          核心包提交：\`$CORE_BIN_REF\`（2dust/v2rayN-core-bin）
          验证：单元测试、隔离 SSH 集成测试、全部平台编译与包完整性检查。
          macOS 本地已验证原生唤醒通知与 SSH 静默卡住恢复；真实休眠、整夜休眠及整机重启需安装后验收。

