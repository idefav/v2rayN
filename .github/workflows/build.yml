name: build

on:
  workflow_call:
    inputs:
      target: # windows linux macos
        required: true
        type: string
      project:
        required: false
        type: string
        default: './v2rayN.Desktop/v2rayN.Desktop.csproj'
      artifact_prefix:
        required: false
        type: string
        default: ''

jobs:
  build:
    name: build x64 arm64
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    runs-on: |-
      ${{
        case(
          inputs.target == 'macos', 'macos-latest',
          inputs.target == 'linux', 'ubuntu-24.04',
          inputs.target == 'windows', 'windows-latest',
          'ubuntu-latest'
        )
      }}
    env:
      Output: "${{ github.workspace }}/${{ matrix.arch }}"
      RID: |-
        ${{
          case(
            inputs.target == 'macos', format('osx-{0}', matrix.arch),
            inputs.target == 'windows', format('win-{0}', matrix.arch),
            format('{0}-{1}', inputs.target, matrix.arch)
          )
        }}
      Project: ${{ inputs.project }}
      ExtOpt: |-
        ${{
          case(
            inputs.target == 'windows', '-p:EnableWindowsTargeting=true',
            ''
          )
        }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Purge SDKs
      shell: pwsh
      run: |
        echo "Before:"
        dotnet --list-sdks
        
        dotnet --list-sdks | % {
          $_ -match '^\S+\s+\[(.+)\]$' > $null
          $d = Join-Path $Matches[1] $_.Split()[0]
          Write-Host "Removing $d"
          if ($IsWindows) { rm $d -r -fo } else { sudo rm -rf "$d" }
        }
        
        echo "After:"
        dotnet --list-sdks 2>$null; $LASTEXITCODE=0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.1xx
        
    - name: Build v2rayN
      shell: bash
      working-directory: ./v2rayN
      run: dotnet publish $Project -c Release -r $RID -p:SelfContained=true $ExtOpt -o $Output

    - name: Build AmazTool
      shell: bash
      working-directory: ./v2rayN
      run: dotnet publish ./AmazTool/AmazTool.csproj -c Release -r $RID -p:SelfContained=true -p:PublishTrimmed=true $ExtOpt -o $Output

    - name: Remove Debug Symbols
      shell: bash
      run: |
        find ${{ matrix.arch }} -type f -name '*.pdb' -delete

    - name: Setup Go for SSH UDP core and proxy checks
      uses: actions/setup-go@v6
      with:
        go-version-file: proxy-check/go.mod
        cache-dependency-path: proxy-check/go.sum

    - name: Install ARM64 core compiler
      if: inputs.target == 'linux' && matrix.arch == 'arm64'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu

    - name: Build pinned SSH UDP core
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.target }}" in
          macos) core_os=darwin ;;
          windows) core_os=windows ;;
          linux) core_os=linux ;;
        esac
        core_arch=${{ matrix.arch }}
        [[ "$core_arch" != x64 ]] || core_arch=amd64
        core_name=sing-box
        [[ "$core_os" != windows ]] || core_name=sing-box.exe
        bash packaging/build-ssh-core.sh "$core_os" "$core_arch" "$Output/bin/sing_box/$core_name"

    - name: Build bundled proxy-check worker
      shell: bash
      working-directory: ./proxy-check
      run: |
        set -euo pipefail
        export CGO_ENABLED=0
        case "${{ inputs.target }}" in
          macos) export GOOS=darwin ;;
          windows) export GOOS=windows ;;
          linux) export GOOS=linux ;;
        esac
        case "${{ matrix.arch }}" in
          x64) export GOARCH=amd64 ;;
          arm64) export GOARCH=arm64 ;;
        esac
        worker=proxy-check
        if [[ "$GOOS" == windows ]]; then worker=proxy-check.exe; fi
        go build -trimpath -ldflags='-s -w' -o "$Output/$worker" .
        test -s "$Output/$worker"
        if [[ "$GOOS" != windows ]]; then chmod +x "$Output/$worker"; fi

    - name: Verify worker tests
      shell: bash
      working-directory: ./proxy-check
      run: go test ./...

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact_prefix }}${{ matrix.arch }}
        path: ${{ matrix.arch }}
