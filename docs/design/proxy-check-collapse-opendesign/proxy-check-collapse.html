function stopQueue(){clearTimeout(state.timer);state.timer=null;state.epoch++}
function queue(items){const epoch=state.epoch;let index=0;function tick(){if(epoch!==state.epoch)return;const item=items[index++];if(item)state.results[item.id]=fixture(item,state.attempt);if(index>=items.length){state.phase='completed';renderAll();notify(T('演示检查完成；分类保持当前展开状态。','Demo checks completed; current expansion state preserved.'));return}renderSummary();renderGroups();state.timer=setTimeout(tick,480)}state.timer=setTimeout(tick,480)}
function startFullCheck(){stopQueue();state.session++;state.attempt=1;state.snapshotTun=state.tun;state.phase='checking';resetFold();state.results=Object.fromEntries(probes.map(i=>[i.id,pending(i)]));renderAll();notify(T('新完整检查：分类、证据和路径说明已恢复默认折叠。','New full check: categories, evidence and path notes reset to collapsed.'));queue(probes)}
function retryFailures(){if(state.phase==='checking')return;const items=probes.filter(i=>isFailure(state.results[i.id]));if(!items.length)return;stopQueue();state.attempt++;state.phase='checking';items.forEach(i=>state.results[i.id]=pending(i));renderAll();notify(T('只重试失败项，保留所有分类和证据的展开状态。','Retrying failed items only. All category and evidence expansion states are preserved.'));queue(items)}
function cancelCheck(){if(state.phase!=='checking')return;stopQueue();probes.forEach(i=>{if(!state.results[i.id]?.executed)state.results[i.id]=pending(i,'cancelled')});state.phase='cancelled';renderAll();notify(T('已取消；未执行项不增加完成进度。','Cancelled. Unexecuted items do not increase completion progress.'))}
function setScenario(mode){stopQueue();state.snapshotTun=state.tun;state.attempt=1;state.phase=mode==='checking'?'checking':'completed';state.results=Object.fromEntries(probes.map((item,index)=>[item.id,mode!=='checking'||index<4?fixture(item):pending(item)]));renderAll();if(mode==='checking')queue(probes.slice(4))}
function setTun(on){state.tun=on;startFullCheck()}
function toggleLanguage(){state.lang=state.lang==='zh'?'en':'zh';renderAll()}
function toggleTheme(){state.theme=state.theme==='light'?'dark':'light';renderAll()}
function initialize(){if(typeof location!=='undefined'){const params=new URLSearchParams(location.search);if(['zh','en'].includes(params.get('lang')))state.lang=params.get('lang');if(['light','dark'].includes(params.get('theme')))state.theme=params.get('theme');state.tun=params.get('tun')==='on';if(params.get('scenario')==='checking'){setScenario('checking');return}}setScenario('completed')}
initialize();
</script></body></html>
