 return '<span class="compact-label">'+T('实际出口','Observed exit')+'</span>'+entries.map((e,n)=>{
 const s=geoComparison(item,e,r);return '<div class="geo-ip" data-od-id="exit-'+item.id+'-'+n+'"><div class="mono">'+esc(e.ip)+'</div><div class="geo-location">'+flagMarkup(e)+'<span>'+(e.status==='known'?countryName(e.country)+(e.cityZh?' / '+T(e.cityZh,e.cityEn):''):e.status==='querying'?T('查询中','Looking up'):T('地域未知','Unknown region'))+'</span></div><span class="geo-status '+(s==='mismatch'?'warning':'muted')+'">'+(s==='match'?'✓ ':s==='mismatch'?'≠ ':s==='querying'?'… ':'')+geoLabel(s)+'</span></div>';
 }).join('')+'<span class="probe-sub">'+(item.scope==='resolver'?T('递归解析器出口 · 非客户端','Recursive resolver exit · Not client'):T('逐 IP 地域 · 独立比较','Per-IP region · Independent comparison'))+'</span>';
}
function geoEvidence(item,r){
 const g=r?.geography;return '<section class="geo-provenance" data-od-id="geo-evidence-'+item.id+'"><h3>'+T('第三方地域注释 · 非签名事实','Third-party geography · Not signed fact')+'</h3><p>'+T('地域由第三方数据库估计，不保证物理位置，不是观察端签名事实。此处全部离线虚构。地域不改变 IP/CIDR 比较和既有综合结论。','Third-party database estimate, not guaranteed physical location or observer-signed fact. All records are fictional and offline. Geography does not change IP/CIDR comparison or existing overall conclusions.')+'</p><p>'+T('报告地域预期（OR）','Report expected regions (OR)')+' · '+regionList(g?.expected||state.reportRegions)+' · v'+(g?.configVersion||state.reportVersion)+'</p>'+((g?.entries||[]).map(e=>'<div class="geo-sample"><code>'+esc(e.ip)+'</code><span>'+T('来源','Source')+': '+esc(e.provider)+'</span><span>'+T('查询时间','Lookup time')+': '+(e.queriedAt||T('查询中，尚无时间','Pending; no timestamp yet'))+'</span><span>'+geoLabel(geoComparison(item,e,r))+(item.scope==='resolver'?' · '+T('仅解析器，不参与客户端比较','Resolver only, excluded from client comparison'):'')+'</span></div>').join('')||'<p>'+T('不适用或无有效出口，没有地域采样。','Not applicable or no valid exit; no geographic samples.')+'</p>')+'</section>';
}
rowMarkup=function(item){
 let h=baseRow(item),start=h.indexOf('<div><span class="compact-label">'+T('实际出口','Observed exit')+'</span>'),end=h.indexOf('<div class=',start);
 if(start>=0&&end>start)h=h.slice(0,start)+'<div class="geo-exits">'+geoCell(item,state.results[item.id])+'</div>'+h.slice(end);
 return h.replace(/(<div class="evidence"[^>]*>)/,'$1'+geoEvidence(item,state.results[item.id]));
};
renderSummary=function(){
 baseSummary();$('actions').insertAdjacentHTML('beforeend','<button id="optionsAction" onclick="openOptions()" data-od-id="check-options">'+T('检查选项','Check options')+'</button>');
 $('geoSnapshot').innerHTML='<strong>'+T('地域独立比较','Independent region comparison')+'</strong><span class="small"> · '+T('报告快照','Report snapshot')+' v'+state.reportVersion+' · '+regionList(state.reportRegions)+' (OR)</span><p class="small">'+(state.configVersion!==state.reportVersion?T('配置已保存，下轮完整检查生效；旧报告保持不变。','Configuration saved for the next full check; this report is unchanged.'):T('不改变 IP/CIDR、综合成功/故障或需关注数量。第三方数据库估计，非签名事实。','Does not affect IP/CIDR, overall success/failure or attention counts. Third-party estimate, not signed fact.'))+'</p>';
};
renderChrome=function(){
 baseChrome();$('pageSubtitle').textContent=T('逐 IP 地域独立比较。所有地址和数据库结果均为虚构演示，不发起请求。','Per-IP geography, independently compared. All addresses and database results are fictional; no requests.');
 $('scenario').innerHTML=[['completed','完成 · 含失败','Completed · With failures'],['querying','地域查询中','Region lookup pending'],['unknown','地域未知','Unknown regions'],['multi','多 IP 出口','Multiple exits'],['checking','检查中','Checking']].map(([v,z,e])=>'<option value="'+v+'" '+((state.phase==='checking'?'checking':state.geoMode)===v?'selected':'')+'>'+T(z,e)+'</option>').join('');
 $('reviewNotice').innerHTML=T('评审快照展开 TCP/TLS、DNS、UDP；新完整检查仍重置全部折叠。','Review snapshot opens TCP/TLS, DNS and UDP; a new full check collapses all.')+(state.geoMode==='querying'?' <button onclick="finishGeoLookup()">'+T('模拟完成地域查询','Simulate lookup completion')+'</button>':'');
 if($('regionOptions').open)renderOptions();
};
startFullCheck=function(){state.reportRegions=[...state.savedRegions];state.reportVersion=state.configVersion;state.geoMode='completed';baseStart()};
setScenario=function(mode){state.geoMode=['querying','unknown','multi'].includes(mode)?mode:'completed';baseScenario(mode==='checking'?'checking':'completed')};
function finishGeoLookup(){Object.values(state.results).forEach(r=>r.geography?.entries.forEach(e=>{e.status=e.country?'known':'unknown';e.queriedAt='2026-10-28T14:32:24+08:00'}));state.geoMode='completed';renderAll();notify(T('地域查询模拟完成，IP 结果及统计未变。','Simulated geographic lookup completed; IP results and counts unchanged.'))}
function openOptions(){state.draftRegions=[...state.savedRegions];state.optionQuery='';renderOptions();$('regionOptions').showModal();$('countrySearch').focus()}
function closeOptions(){$('regionOptions').close();restoreFocus('optionsAction')}
function toggleDraft(code,on){if(on&&!state.draftRegions.includes(code))state.draftRegions.push(code);if(!on)state.draftRegions=state.draftRegions.filter(c=>c!==code);renderChoices();restoreFocus('country-'+code)}
function clearRegions(){state.draftRegions=[];renderChoices()}
function renderChoices(){
 const q=state.optionQuery.trim().toLowerCase(),visible=countries.filter(c=>c.some(v=>v.toLowerCase().includes(q)));
 $('countryChoices').innerHTML=visible.map(c=>'<label class="country-choice"><input id="country-'+c[0]+'" type="checkbox" '+(state.draftRegions.includes(c[0])?'checked':'')+' onchange="toggleDraft(\''+c[0]+'\',this.checked)">'+flagMarkup({country:c[0],status:'known'})+'<span>'+countryName(c[0])+'</span><code>'+c[0]+'</code></label>').join('')||'<p class="empty">'+T('没有匹配地区；已选项仍保留。','No matching regions; selections retained.')+'</p>';
 $('selectedRegions').textContent=T('当前草稿','Draft')+' · '+regionList(state.draftRegions)+' · '+state.draftRegions.length+' '+T('项','selected');
}
function saveRegions(){state.savedRegions=[...state.draftRegions];state.configVersion++;closeOptions();renderAll();restoreFocus('optionsAction');notify(T('演示配置已保存，下轮完整检查生效；旧报告和重试保持原快照。','Demo configuration saved for next full check; old report and retries retain their snapshot.'))}
function renderOptions(){
 $('regionOptions').innerHTML='<div class="option-heading"><div><h2 id="optionTitle">'+T('检查选项','Check options')+'</h2><p class="small">'+T('本地演示，不修改真实配置','Local simulation; no real configuration changes')+'</p></div><button onclick="closeOptions()" aria-label="'+T('关闭检查选项','Close check options')+'">'+T('关闭','Close')+'</button></div><div class="option-body"><section><h3>'+T('IP/CIDR 预期 · 保持原配置','IP/CIDR expectations · Retained')+'</h3><code>https.example.net|https|socks = 203.0.113.21</code><p class="small">'+T('只读展示既有口径，不提供 IP 与地域联合通过模式。','Existing comparison shown read-only. No combined IP-and-region pass mode.')+'</p></section><section><h3>'+T('预期国家/地区','Expected countries/regions')+'</h3><p class="small">'+T('多选为 OR：命中任一已选地区即地域匹配，仅为独立注释；无选择为未配置地域。','Multiple selections use OR: any selected region matches. Independent annotation only; no selection means unconfigured.')+'</p><label class="sr-only" for="countrySearch">'+T('搜索国家或地区','Search countries or regions')+'</label><input type="search" id="countrySearch" placeholder="'+T('搜索名称或代码，如 日本 / JP','Search name or code, e.g. Japan / JP')+'" value="'+esc(state.optionQuery)+'" oninput="state.optionQuery=this.value;renderChoices()"><div id="countryChoices" class="country-choices" role="group" aria-label="'+T('国家或地区多选','Country or region selection')+'"></div><div class="flex between wrap"><p id="selectedRegions" class="small" aria-live="polite"></p><button onclick="clearRegions()">'+T('清除选择','Clear selection')+'</button></div></section><section class="option-note"><h3>'+T('保存 · 下轮完整检查生效','Save for the next full check')+'</h3><p>'+T('已保存配置','Saved configuration')+' v'+state.configVersion+': '+regionList(state.savedRegions)+'</p><p>'+T('当前报告快照','Report snapshot')+' v'+state.reportVersion+': '+regionList(state.reportRegions)+'</p><p class="small">'+T('关闭/取消放弃草稿。保存不重算旧报告，重试使用原快照。查询中/未知不算匹配；数据库可能错误，不是签名事实。递归 DNS 只展示解析器地域。','Close/cancel discards the draft. Saving does not recompute old reports; retries retain the snapshot. Pending/unknown never matches. Database estimates may be wrong and are not signed facts. Recursive DNS shows resolver geography only.')+'</p></section></div><div class="option-footer"><button onclick="closeOptions()">'+T('取消','Cancel')+'</button><button class="primary" onclick="saveRegions()" data-od-id="save-region-options">'+T('保存 · 下轮生效','Save · Next full check')+'</button></div>';
 renderChoices();
}

initialize();
state.groups=new Set(["tcp","dns","udp"]);renderAll();
</script></body></html>
