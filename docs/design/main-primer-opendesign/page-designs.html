:root {

  /* ─── Border ───────────────────────────────────────────────────── */
  --border:      #d0d7de;              /* border-default — hairline structural */
  --border-soft: #d8dee4;             /* border-muted — inner panel dividers */

  /* ─── Accent ───────────────────────────────────────────────────── */

  /* ─── Semantic ─────────────────────────────────────────────────── */
  --success: #1a7f37;                  /* GitHub green — merge, open, success */
  --warn:    #9a6700;                  /* attention amber text */
  --danger:  #cf222e;                  /* closed / destructive red */

  /* ─── Typography ───────────────────────────────────────────────── */
  /* System fonts only — no webfonts load in GitHub. */
  --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";

  --font-mono:    ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  /* Type scale — DESIGN.md §Typography.
   * GitHub's prose density: 14px body (not 16px). Display sits at 32px.
   * h2 (20px) and h3 (16px) collapse close together for density. */
  --text-xs:   12px;                   /* body-small — captions, metadata */
  --text-sm:   14px;                   /* body — default UI (GitHub's base) */
  --text-base: 14px;                   /* body baseline = 14px for density */
  --text-lg:   16px;                   /* h3 / panel header */
  --text-xl:   20px;                   /* h2 — section heading */
  --text-2xl:  24px;                   /* h1 — page heading */
  --text-3xl:  28px;                   /* subpage display */
  --text-4xl:  32px;                   /* display — repo header / hero */

  /* Leading + tracking.
   * GitHub uses 1.25 for headings (tight-but-readable), 1.5 for body.
   * Only display gets the -0.01em tracking. */
  --leading-body:     1.5;
  --leading-tight:    1.25;
  --tracking-display: -0.01em;

  /* ─── Spacing ──────────────────────────────────────────────────── */
  /* 4px base grid — Primer spacing. Row padding 16px h, 12px v. */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;

  /* Section rhythm — GitHub marketing pages. */
  --section-y-desktop: 64px;
  --section-y-tablet:  48px;
  --section-y-phone:   32px;

  /* ─── Radius ──────────────────────────────────────────────────── */
  /* 6px is the universal Primer radius for all interactive elements. */
  --radius-sm:   6px;
  --radius-md:   6px;
  --radius-lg:   12px;
  --radius-pill: 9999px;

  /* ─── Elevation ────────────────────────────────────────────────── */
  /* GitHub uses hairline borders, not shadows, as the primary depth

  --elev-flat:   none;
  --elev-ring:   0 0 0 1px var(--border);
  --elev-raised: 0 1px 3px rgba(31, 35, 40, 0.12), 0 8px 24px rgba(66, 74, 83, 0.12);

  /* ─── Focus ────────────────────────────────────────────────────── */
  /* Primer focus: 3px rgba ring on the accent color. */
  --focus-ring: 0 0 0 3px rgba(9, 105, 218, 0.3);

  /* ─── Motion ───────────────────────────────────────────────────── */
  /* GitHub avoids animation. 80ms hover, 200ms open — short and purposeful. */
  --motion-fast:   80ms;
  --motion-base:   200ms;
  --ease-standard: ease-out;

  /* ─── Layout ───────────────────────────────────────────────────── */
  --container-max:            1280px;
  --container-gutter-desktop: 24px;
  --container-gutter-tablet:  16px;
  --container-gutter-phone:   16px;
}

function runJob(key,done,fail=S.preview==='error',stages=null,onFailure=null){if(jobBusy(key)||S.preview==='busy')return false;const epoch=(S.jobEpoch[key]||0)+1;S.jobEpoch[key]=epoch;S.jobs[key]={state:'busy',progress:0,stage:0,stages};render();function step(){if(S.jobEpoch[key]!==epoch)return;const j=S.jobs[key];j.progress=Math.min(100,j.progress+25);j.stage=Math.min(3,Math.floor(j.progress/25));if(j.progress===100){j.state=fail?'error':'done';if(!fail&&done)done();if(fail&&onFailure)onFailure();if(fail)addLog('ERROR',T('模拟操作失败，保留原数据','Simulated operation failed; previous data retained'));render();toast(fail?T('模拟失败 · 可重试，原数据保持','Simulation failed · Retry available; previous data retained'):T('演示操作完成 · 未执行真实系统操作','Demo completed · No real system action'))}else{render();setTimeout(step,250)}}setTimeout(step,250);return true}

function syntaxIssue(text){try{const data=JSON.parse(text);if(!data||Array.isArray(data)||typeof data!=='object')return {ok:false,message:T('根必须是 JSON 对象','Root must be a JSON object'),line:1,column:1};return {ok:true,data}}catch(err){let line=1,column=1,pos=0;const p=err.message.match(/position\s+(\d+)/i),lc=err.message.match(/line\s+(\d+)\s+column\s+(\d+)/i);if(p){pos=Math.min(Number(p[1]),text.length);const before=text.slice(0,pos).split('\n');line=before.length;column=before[before.length-1].length+1}else if(lc){line=Number(lc[1]);column=Number(lc[2]);pos=text.split('\n').slice(0,line-1).reduce((a,b)=>a+b.length+1,0)+column-1}else{pos=text.length;const parts=text.split('\n');line=parts.length;column=parts[parts.length-1].length+1}return {ok:false,line,column,pos,message:T('语法错误','Syntax error')+` · ${T('行','line')} ${line}, ${T('列','column')} ${column}\n`+err.message}}}

// Fixed Version 3-L byte-mode QR; one block of 55 data + 15 RS codewords.
function makeQR(text){const bytes=Array.from(text,c=>c.charCodeAt(0));if(bytes.some(b=>b>127)||bytes.length>53)throw Error('Demo QR accepts up to 53 ASCII bytes');const bits=[];const append=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1)};append(4,4);append(bytes.length,8);bytes.forEach(b=>append(b,8));append(0,Math.min(4,440-bits.length));while(bits.length%8)bits.push(0);const data=[];for(let i=0;i<bits.length;i+=8)data.push(bits.slice(i,i+8).reduce((v,b)=>(v<<1)|b,0));while(data.length<55)data.push(data.length%2===Math.ceil(bits.length/8)%2?236:17);function mul(x,y){let r=0;while(y){if(y&1)r^=x;x<<=1;if(x&256)x^=285;y>>=1}return r}let divisor=[1],root=1;for(let i=0;i<15;i++){const next=Array(divisor.length+1).fill(0);divisor.forEach((n,j)=>{next[j]^=n;next[j+1]^=mul(n,root)});divisor=next;root=mul(root,2)}const remainder=Array(15).fill(0);for(const n of data){const factor=n^remainder.shift();remainder.push(0);for(let j=0;j<15;j++)remainder[j]^=mul(divisor[j+1],factor)}const codewords=[...data,...remainder],size=29,cells=Array.from({length:size},()=>Array(size).fill(false)),fixed=Array.from({length:size},()=>Array(size).fill(false));const put=(x,y,v)=>{if(x>=0&&x<size&&y>=0&&y<size){cells[y][x]=!!v;fixed[y][x]=true}};function finder(x,y){for(let dy=-1;dy<=7;dy++)for(let dx=-1;dx<=7;dx++){const d=Math.max(Math.abs(dx-3),Math.abs(dy-3));put(x+dx,y+dy,d!==2&&d!==4)}}finder(0,0);finder(22,0);finder(0,22);for(let i=8;i<21;i++){put(i,6,i%2===0);put(6,i,i%2===0)}for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)put(22+dx,22+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);let rem=8;for(let i=0;i<10;i++)rem=(rem<<1)^((rem>>>9)*1335);const format=((8<<10)|rem)^21522,bit=i=>(format>>>i)&1;for(let i=0;i<=5;i++)put(8,i,bit(i));put(8,7,bit(6));put(8,8,bit(7));put(7,8,bit(8));for(let i=9;i<15;i++)put(14-i,8,bit(i));for(let i=0;i<8;i++)put(size-1-i,8,bit(i));for(let i=8;i<15;i++)put(8,size-15+i,bit(i));put(8,size-8,true);let at=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let v=0;v<size;v++)for(let j=0;j<2;j++){const x=right-j,y=((right+1)&2)===0?size-1-v:v;if(!fixed[y][x]){const value=at<codewords.length*8?((codewords[at>>>3]>>>(7-(at&7)))&1):0;cells[y][x]=!!(value^((x+y)%2===0?1:0));at++}}}return {size,cells,fixed,codewords,data,divisor,format,placed:at}}
function qrSVG(text){const qr=makeQR(text);let path='';qr.cells.forEach((row,y)=>row.forEach((v,x)=>{if(v)path+=`M${x} ${y}h1v1h-1z`}));return `<svg class="qr" viewBox="-4 -4 37 37" role="img" aria-label="${T('编码固定虚构链接的演示二维码','Demo QR encoding the fixed fictional link')}"><rect x="-4" y="-4" width="37" height="37" fill="white"/><path d="${path}" fill="black"/></svg>`}
function applyHash(){if(typeof location==='undefined')return;const raw=location.hash.replace(/^#/,'')||'catalog',parts=raw.split('?'),segment=parts[0].split('/'),params=new URLSearchParams(parts[1]||'');S.route=routes.some(r=>r[0]===segment[0])?segment[0]:'catalog';S.variant=segment[1]||'';if(['Xray','sing-box'].includes(S.variant))S.engine=S.variant;if(S.route==='backup'&&['local','webdav'].includes(S.variant))S.backupMode=S.variant;if(S.route==='updates'&&['client','kernel'].includes(S.variant))S.updateKind=S.variant;if(['zh','en'].includes(params.get('lang')))S.lang=params.get('lang');if(['light','dark'].includes(params.get('theme')))S.theme=params.get('theme');if(['normal','empty','busy','error','unavailable'].includes(params.get('state')))S.preview=params.get('state');if(['macOS','Windows','Linux'].includes(params.get('platform')))S.platform=params.get('platform');if(S.route==='node-editor'&&['key','password'].includes(params.get('auth')))S.values['node-auth']=params.get('auth');if(params.get('sample')==='restore'){S.backupReady=true;S.backupValidated=true}if(S.route==='policies'&&S.variant==='')S.variant='manual';if(S.route==='ssh-deploy'&&params.has('step')){S.wizardStep=Math.max(0,Math.min(5,Number(params.get('step'))||0));S.wizardAck=S.wizardStep>=2}if(params.get('sample')==='json-error'){S.json[jsonKey()]='{\n  "dns": {\n    "servers": [\n      {"server": "dns.example.net",}\n    ]\n  }\n}';S.jsonError[jsonKey()]=syntaxIssue(S.json[jsonKey()]).message;S.dirty=true}render();if(params.get('sample')==='restore'){S.backupReady=true;S.backupValidated=true;openRestore()}if(params.get('scroll')==='bottom')$('content').scrollTop=$('content').scrollHeight}
