<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>次级页面 · 代表性真实视口复查</title><style>
body{margin:0;padding:16px;background:oklch(96% .004 250);color:oklch(26% .014 258);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}h1{font-size:20px;margin:0 0 4px}p{margin:0 0 16px}.matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-width:1320px}.case{border:1px solid oklch(84% .01 250);background:oklch(100% 0 0);padding:8px;overflow:hidden}h2{font-size:12px;font-weight:600;margin:0 0 8px}.viewport{height:548px;position:relative}iframe{border:0;display:block;transform-origin:top left;background:oklch(100% 0 0)}a{color:inherit}
</style></head><body><h1>次级页面 · 代表性真实视口复查</h1><p>12个项目内 iframe：长表单、JSON错误、恢复覆盖确认、SSH向导；1440/760/600 × 900。仅缩放展示，不改变实际布局宽度。全部为演示。</p><div class="matrix" id="matrix"></div><script>
const cases=[
 ['长表单 / SSH',1440,'node-editor/SSH','zh','light','scroll=bottom'],['Long form / SSH',760,'node-editor/SSH','en','dark','scroll=bottom'],['长表单 / SSH',600,'node-editor/SSH','zh','dark','scroll=bottom'],
 ['JSON error / Xray',1440,'dns/Xray','en','dark','sample=json-error&scroll=bottom'],['JSON错误 / sing-box',760,'dns/sing-box','zh','light','sample=json-error&scroll=bottom'],['JSON error / sing-box',600,'dns/sing-box','en','light','sample=json-error&scroll=bottom'],
 ['恢复覆盖确认',1440,'backup/local','zh','dark','sample=restore'],['Restore overwrite',760,'backup/webdav','en','light','sample=restore'],['Restore overwrite',600,'backup/webdav','en','dark','sample=restore'],
 ['SSH authorization preview',1440,'ssh-deploy','en','light','step=3'],['SSH身份核对',760,'ssh-deploy','zh','dark','step=1'],['SSH失败恢复',600,'ssh-deploy','zh','light','step=5&state=error']
];for(const [name,width,route,lang,theme,extra]of cases){const tile=document.createElement('section');tile.className='case';tile.setAttribute('data-od-id','visual-'+route.replaceAll('/','-')+'-'+width);const heading=document.createElement('h2'),link=document.createElement('a');link.href=`../page-designs.html#${route}?lang=${lang}&theme=${theme}&${extra}`;link.textContent=`${name} · ${width}×900 · ${lang} / ${theme}`;heading.appendChild(link);tile.appendChild(heading);const viewport=document.createElement('div');viewport.className='viewport';const frame=document.createElement('iframe');frame.title=link.textContent;frame.src=link.href;frame.width=width;frame.height=900;frame.style.transform=`scale(${width===1440?.29:width===760?.54:.6})`;viewport.appendChild(frame);tile.appendChild(viewport);document.getElementById('matrix').appendChild(tile)}
</script></body></html>
