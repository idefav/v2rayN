<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运行态诊断 · 本地视觉复查矩阵</title>
<style>
body{margin:0;padding:16px;background:oklch(96% .004 250);color:oklch(26% .014 258);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}h1{font-size:20px;margin:0 0 4px}p{margin:0 0 16px}.matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-width:1320px}.case{border:1px solid oklch(84% .01 250);background:oklch(100% 0 0);padding:8px;overflow:hidden}h2{font-size:12px;font-weight:600;margin:0 0 8px}.viewport{height:540px;position:relative}iframe{border:0;display:block;transform-origin:top left;background:oklch(100% 0 0)}a{color:inherit}
</style></head><body><h1>运行态诊断 · 视觉复查矩阵</h1><p>项目内真实 iframe 视口：1440×900、760×900、600×900 × 中文/英文 × 浅色/深色。仅缩放展示，不改变 iframe 布局尺寸。全部为演示。</p><div class="matrix" id="matrix"></div><script>
for(const language of ['zh','en'])for(const theme of ['light','dark'])for(const width of [1440,760,600]){const tile=document.createElement('section');tile.className='case';tile.setAttribute('data-od-id',`review-${language}-${theme}-${width}`);const heading=document.createElement('h2');const link=document.createElement('a');link.href=`../index.html#diagnostics/partial/${language}/${theme}`;link.textContent=`${width}×900 · ${language==='zh'?'中文':'English'} · ${theme==='light'?'浅色':'深色'}`;heading.appendChild(link);tile.appendChild(heading);const view=document.createElement('div');view.className='viewport';const frame=document.createElement('iframe');frame.title=link.textContent;frame.src=link.href;frame.width=width;frame.height=900;frame.style.transform=`scale(${width===1440?0.29:width===760?0.54:0.6})`;view.appendChild(frame);tile.appendChild(view);document.getElementById('matrix').appendChild(tile)}
</script></body></html>
