:root {
  /* ─── Surface ──────────────────────────────────────────────────── */
  --bg:           #ffffff;
  --surface:      #f6f8fa;              /* canvas-subtle — sidebar, input bg */
  --surface-warm: var(--surface);       /* Primer has no warm tier */

  /* ─── Foreground ───────────────────────────────────────────────── */
  --fg:   #1f2328;                      /* fg-default — ink */
  --fg-2: #1f2328;                      /* same ink; no B-slot split in Primer */
  --muted: #656d76;                     /* fg-muted — captions, file paths */
  --meta:  #656d76;                     /* same muted tier */

  /* ─── Border ───────────────────────────────────────────────────── */
  --border:      #d0d7de;              /* border-default — hairline structural */
  --border-soft: #d8dee4;             /* border-muted — inner panel dividers */

  /* ─── Accent ───────────────────────────────────────────────────── */
  --accent:        #0969da;            /* Primer Blue — links, primary CTAs */
  --accent-on:     #ffffff;
  --accent-hover:  #0550ae;            /* darker pressed state */
  --accent-active: color-mix(in oklab, var(--accent), black 14%);

  /* ─── Semantic ─────────────────────────────────────────────────── */
  --success: #1a7f37;                  /* GitHub green — merge, open, success */
  --warn:    #9a6700;                  /* attention amber text */
  --danger:  #cf222e;                  /* closed / destructive red */

  /* ─── Typography ───────────────────────────────────────────────── */
  /* System fonts only — no webfonts load in GitHub. */
  --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  --font-body:    -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  --font-mono:    ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  /* Type scale — DESIGN.md §Typography.
   * GitHub's prose density: 14px body (not 16px). Display sits at 32px.
   * h2 (20px) and h3 (16px) collapse close together for density. */
  --text-xs:   12px;                   /* body-small — captions, metadata */
  --text-sm:   14px;                   /* body — default UI (GitHub's base) */
  --text-base: 14px;                   /* body baseline = 14px for density */
  --text-lg:   16px;                   /* h3 / panel header */
  --text-xl:   20px;                   /* h2 — section heading */
  --text-2xl:  24px;                   /* h1 — page heading */
  --text-3xl:  28px;                   /* subpage display */
  --text-4xl:  32px;                   /* display — repo header / hero */

  /* Leading + tracking.
   * GitHub uses 1.25 for headings (tight-but-readable), 1.5 for body.
   * Only display gets the -0.01em tracking. */
  --leading-body:     1.5;
  --leading-tight:    1.25;
  --tracking-display: -0.01em;

  /* ─── Spacing ──────────────────────────────────────────────────── */
  /* 4px base grid — Primer spacing. Row padding 16px h, 12px v. */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;

  /* Section rhythm — GitHub marketing pages. */
  --section-y-desktop: 64px;
  --section-y-tablet:  48px;
  --section-y-phone:   32px;

  /* ─── Radius ──────────────────────────────────────────────────── */
  /* 6px is the universal Primer radius for all interactive elements. */
  --radius-sm:   6px;
  --radius-md:   6px;
  --radius-lg:   12px;
  --radius-pill: 9999px;

  /* ─── Elevation ────────────────────────────────────────────────── */
  /* GitHub uses hairline borders, not shadows, as the primary depth
     signal. --elev-raised is a whisper for the rare floating element. */
  --elev-flat:   none;
  --elev-ring:   0 0 0 1px var(--border);
  --elev-raised: 0 1px 3px rgba(31, 35, 40, 0.12), 0 8px 24px rgba(66, 74, 83, 0.12);

  /* ─── Focus ────────────────────────────────────────────────────── */
  /* Primer focus: 3px rgba ring on the accent color. */
  --focus-ring: 0 0 0 3px rgba(9, 105, 218, 0.3);

  /* ─── Motion ───────────────────────────────────────────────────── */
  /* GitHub avoids animation. 80ms hover, 200ms open — short and purposeful. */
  --motion-fast:   80ms;
  --motion-base:   200ms;
  --ease-standard: ease-out;

  /* ─── Layout ───────────────────────────────────────────────────── */
  --container-max:            1280px;
  --container-gutter-desktop: 24px;
  --container-gutter-tablet:  16px;
  --container-gutter-phone:   16px;
}

 const row=i=>{const r=results[i.id];return `<tr data-od-id="check-row-${i.id}"><td><button class="diagnostic-name" onclick="toggleEvidence('${i.id}')" aria-expanded="${expandedChecks.has(i.id)}" aria-controls="evidence-${i.id}" data-od-id="expand-${i.id}">${expandedChecks.has(i.id)?'−':'＋'} ${esc(itemName(i))}</button><span class="small mono">${esc(i.target)}</span><span class="small ${outcomeClass(r?.outcome)}">${r?statusText(r.outcome):t('pending')}</span></td><td>${t(i.path)}<span class="small mono">${i.protocol}</span></td><td class="${outcomeClass(r?.communication)}">${communicationText(i,r)}</td><td>${observedMarkup(i,r)}</td><td class="${r?.compared?outcomeClass(r.match?'passed':'failed'):'muted'}">${comparisonText(i,r)}${r?.expected?`<span class="small mono">${t('expected')}: ${esc(r.expected)}</span>`:''}</td><td class="mono">${r?.ms==null?'—':r.ms+' ms'}</td></tr><tr id="evidence-${i.id}" ${expandedChecks.has(i.id)?'':'hidden'}><td colspan="6">${evidenceMarkup(i,r)}</td></tr>`};
 const card=i=>{const r=results[i.id];return `<article class="diagnostic-card" data-od-id="check-card-${i.id}"><div class="flex between wrap"><h3>${esc(itemName(i))}</h3><span class="${outcomeClass(r?.outcome)} small">${r?statusText(r.outcome):t('pending')}</span></div><div class="small mono">${esc(i.target)}</div><dl><div><dt>${t('checkPath')}</dt><dd>${t(i.path)} · ${i.protocol}</dd></div><div><dt>${t('communication')}</dt><dd class="${outcomeClass(r?.communication)}">${communicationText(i,r)}</dd></div><div><dt>${t('observed')}</dt><dd>${observedMarkup(i,r)}</dd></div><div><dt>${t('comparison')}</dt><dd class="${r?.compared?outcomeClass(r.match?'passed':'failed'):'muted'}">${comparisonText(i,r)}${r?.expected?`<div class="small mono">${t('expected')}: ${esc(r.expected)}</div>`:''}</dd></div><div><dt>${t('elapsed')}</dt><dd class="mono">${r?.ms==null?'—':r.ms+' ms'}</dd></div></dl><details ${expandedChecks.has(i.id)?'open':''} ontoggle="this.open?expandedChecks.add('${i.id}'):expandedChecks.delete('${i.id}')"><summary>${t('expandEvidence')}</summary>${evidenceMarkup(i,r,'card')}</details></article>`};
 $('main').innerHTML=`<div class="view" data-od-id="proxy-check-page"><div class="page-head"><div><h1 data-od-id="diagnostic-heading">${t('checks')}</h1><p class="small diagnostic-hint">${t('checkSubtitle')}</p></div><span class="pill">${t('demo')}</span></div><section class="diagnostic-context" data-od-id="runtime-check-snapshot"><div><span class="small">${t(checkSession?'runtimeSnapshot':'runtimePending')} ${checkSession?'· '+checkSession.id:''}</span><strong>${esc(contextName)||t('stopped')}</strong><div class="small">${snapshot.protocol} · ${t('snapshotProxy')}: ${t(snapshot.proxy)} · TUN: ${t(snapshot.tun?'enabled':'disabled')} · ${t(snapshot.route)}</div><p class="small" style="margin-top:6px">${t('snapshotNotice')}</p></div><div><span class="pill ${stale?'warning':'muted'}">${t(stale?'snapshotChanged':'demo')}</span><button onclick="openControls()" data-od-id="diagnostic-connection-control">${t('control')}</button></div></section>${stale?`<div class="diagnostic-warning" role="status" data-od-id="stale-report">${t(checkSession?.reason==='configChanged'?'configChanged':'reportStale')}</div>`:''}${!kernel?`<div class="notice">${t('diagnosticEmpty')}</div>`:''}<p class="small diagnostic-hint">${t('checkIntro')}</p><div class="check-stats diagnostic-summary" data-od-id="check-summary">${[['checkTotal',progress.total,''],['communication',comm,'good'],['expectedMatch',matches,'good'],['notCompared',rr.filter(r=>r.executed&&!r.compared).length,'muted']].map(([k,v,c])=>`<div class="check-stat"><span class="small">${t(k)}</span><strong class="${c}">${v}</strong></div>`).join('')}</div><section class="panel" data-od-id="check-results"><div class="toolbar diagnostic-toolbar"><select aria-label="${t('showAll')}" onchange="checkFilter=this.value;renderChecks()" data-od-id="diagnostic-filter"><option value="">${t('showAll')}</option>${['passed','failed','unsupported','indeterminate','skipped','cancelled'].map(k=>`<option value="${k}" ${checkFilter===k?'selected':''}>${t(k)}</option>`).join('')}</select><button onclick="openBaseline()" ${checking?'disabled':''} data-od-id="diagnostic-baseline">${t('baseline')}</button><button onclick="openObserver()" ${checking?'disabled':''} data-od-id="observer-settings">${t('observer')}</button><button onclick="exportChecks()" ${!checkSession?'disabled':''} data-od-id="diagnostic-export">${t('export')}</button><div class="diagnostic-actions">${checking?`<button onclick="cancelChecks()" data-od-id="cancel-check">${t('cancelCheck')}</button>`:`<button onclick="retryFailedChecks()" ${!failedItems().length||stale||busy?'disabled':''} data-od-id="retry-failed">${t('retryFailed')}</button><button class="primary" onclick="startChecks()" ${!kernel||busy||!running?'disabled':''} data-od-id="start-check">${t(checkSession?'retry':'runCheck')}</button>`}</div></div><div class="panel-body"><div class="progress-wrap check-progress"><span class="check-status ${checkState==='partial'?'warning':''}">${t(checkState)}</span><progress max="${progress.total}" value="${progress.executed}" aria-label="${t('coverage')}"></progress><span class="mono">${progress.executed}/${progress.total}</span><span class="small">${t('coverage')}</span></div><p class="small" style="margin-top:8px">${t('filterMeaning')}</p></div><div class="diagnostic-desktop"><table class="diagnostic-table"><thead><tr>${['protocolTarget','checkPath','communication','observed','comparison','elapsed'].map(k=>`<th scope="col">${t(k)}</th>`).join('')}</tr></thead><tbody>${diagnosticGroups.map(g=>{const items=list.filter(i=>i.g===g);return items.length?`<tr class="check-group"><td colspan="6">${t(g)} · ${items.length}</td></tr>${items.map(row).join('')}`:''}).join('')||`<tr><td colspan="6" class="empty">${t('noResults')}</td></tr>`}</tbody></table></div><div class="diagnostic-cards">${diagnosticGroups.map(g=>{const items=list.filter(i=>i.g===g);return items.length?`<section data-od-id="diagnostic-group-${g}"><h2 class="diagnostic-group-label">${t(g)} · ${items.length}</h2>${items.map(card).join('')}</section>`:''}).join('')||`<div class="empty">${t('noResults')}</div>`}</div></section><p class="small">${t('resultHint')} · ${t('simulationOnly')}</p></div>`;
}
function validDocumentationAddress(v,family){if(family!==6)return validIp(v);try{const u=new URL('http://['+v+']/');return /^\[2001:db8:/i.test(u.hostname)}catch(e){return false}}
function openBaseline(){const available=diagnosticItems.filter(i=>i.scope==='client'),item=available[0];openModal(t('baselineTitle'),`<p class="small">${t('baselineHint')}</p><label class="field">${t('baselineNode')}<select id="baselineItem" onchange="document.getElementById('expectedIp').value=baselines[baselineKey(diagnosticItems.find(i=>i.id===this.value))]||''">${available.map(i=>`<option value="${i.id}">${esc(itemName(i))} · ${i.protocol} · ${esc(i.target)} · ${t(i.path)}</option>`).join('')}</select></label><label class="field">${t('expectedIp')}<input id="expectedIp" value="${esc(baselines[baselineKey(item)]||'')}" placeholder="203.0.113.21 / 2001:db8::21"></label><p class="small">${t('baselineScope')}</p><p id="baselineError" class="bad" role="alert"></p>`,`<button onclick="closeModal()">${t('cancel')}</button><button class="primary" onclick="saveBaseline()">${t('save')}</button>`)}
function saveBaseline(){const item=diagnosticItems.find(i=>i.id===$('baselineItem').value&&i.scope==='client'),v=$('expectedIp').value.trim();if(!item||v&&!validDocumentationAddress(v,item.family||4)){$('baselineError').textContent=t('invalidIp');return}baselines[baselineKey(item)]=v;resetDiagnosticReport();closeModal();renderChecks();notify(t('baselineSaved'))}
function validObserverUrl(value){try{const u=new URL(value);return u.protocol==='https:'&&!u.username&&!u.password&&validHost(u.hostname)&&(!u.port||Number(u.port)>=1&&Number(u.port)<=65535)}catch(e){return false}}
function validObserverEndpoint(value){const parts=value.split(':');return parts.length===2&&validHost(parts[0])&&/^\d+$/.test(parts[1])&&Number(parts[1])>=1&&Number(parts[1])<=65535}
function openObserver(){openModal(t('observerTitle'),`<p class="small">${t('observerHint')}</p>${[['http','httpObserver'],['stun','stunObserver'],['dns','dnsObserver'],['http3','h3Observer']].map(([k,label])=>`<label class="field">${t(label)}<input id="observer-${k}" value="${esc(observerConfig[k])}" spellcheck="false"></label>`).join('')}<div id="observerError" role="alert" class="bad"></div>`,`<button onclick="closeModal()">${t('cancel')}</button><button class="primary" onclick="saveObserver()">${t('save')}</button>`)}
function saveObserver(){const draft=Object.fromEntries(['http','stun','dns','http3'].map(k=>[k,$('observer-'+k).value.trim()]));if(!validObserverUrl(draft.http)||!validObserverUrl(draft.http3)||!validObserverEndpoint(draft.stun)||!validObserverEndpoint(draft.dns)){$('observerError').textContent=t('observerInvalid');return}observerConfig=draft;observer=draft.http;bindObserverTargets();resetDiagnosticReport();closeModal();if(page==='checks')renderChecks();notify(t('observerSaved'))}
function checkExportPayload(){return {schemaVersion:2,demo:true,liveValidated:false,session:checkSession?JSON.parse(JSON.stringify({...checkSession,stale:sessionStale()})):null,progress:checkProgress(),evidencePolicy:'Protocol/path-bound client observations only; recursive resolver source is separate; no cached node exit evidence.',results:diagnosticItems.map(i=>({itemId:i.id,group:i.g,protocol:i.protocol,target:i.target,path:i.path,baselineKey:baselineKey(i),...(results[i.id]||{executed:false,outcome:'pending',observed:'',samples:[]})}))}}
function exportChecks(){download('v2rayn-demo-runtime-diagnostics.json',JSON.stringify(checkExportPayload(),null,2),'application/json')}
function previewState(s){
 if(busy){$('scenario').value=preview;return}stopCheckTimer();preview=s;checkFilter='';
 if(s==='normal'){restoreDemo();page='nodes';resetDiagnosticReport()}
 else if(s==='firstUse'){resetDiagnosticReport();nodes=[];checked.clear();running=null;selected=null;kernel=false;page='nodes'}
 else {if(!nodes.length)nodes=seed.map(n=>({...n}));if(!nodes.some(n=>n.id===selected))selected=2;if(!running)running=1;kernel=s!=='kernelOff';failNext=s==='applyFailure';
  if(s==='applyFailure'){page='nodes';selected=nodes.find(n=>n.id!==running)?.id;detailOpen=true;notify(t('applyFailure'))}
  else if(['checking','partial','completed','cancelled'].includes(s)){page='checks';if(s==='checking'){startChecks();return}checkSession=createCheckSession();results={};diagnosticItems.forEach((item,i)=>{if(s==='cancelled'&&i>=4){results[item.id]=unexecutedResult(item);return}let r=resultFor(item);if(s==='completed'&&r.outcome==='failed'){r={...r,communication:'passed',ok:true,observed:r.expected||item.ip||'',compared:!!r.expected,match:!!r.expected,comparison:r.expected?'compareMatch':'noExpectation',outcome:r.expected?'passed':'indeterminate',source:item.source};r.samples=[{id:`${checkSession.id}/${item.id}/1/preview`,observed:r.observed,source:r.source,scope:r.scope,time:'14:32:18',synthetic:true}]}results[item.id]=r});checkState=s;checkSession.status=s;checkSession.reason=s==='cancelled'?'user':null;checkSession.finishedAt='14:32:30'}else page='nodes';
 }render();
}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify(t('exportHint'))}
function exportLogs(){download('v2rayn-demo-logs.txt','DEMO ONLY — NOT LIVE VALIDATED\n'+logs.map(l=>`${l.time} ${l.level} ${t(l.key)} ${l.extra}`).join('\n'),'text/plain')}
function renderSecondary(){let body='';if(page==='groups')body=`<section class="panel"><div class="panel-head flex between"><h2>${t('groups')}</h2><button onclick="notify(t('syncDone'));log('syncDone')">${t('sync')}</button></div><table><thead><tr><th>${t('group')}</th><th>${t('nodeCount')}</th><th>${t('subscription')}</th></tr></thead><tbody>${['groupDirect','groupDomestic','groupHK','groupSub'].map(g=>`<tr><td>${t(g)}</td><td>${nodes.filter(n=>n.g===g).length}</td><td class="mono">${g==='groupSub'?'https://subscribe.example.org/demo':'—'}</td></tr>`).join('')}</tbody></table></section>`;

if(page==='connections')body=kernel?`<section class="panel"><div class="panel-head"><h2>${t('connections')} · ${t('demo')}</h2></div><table><thead><tr>${['process','destination','route','traffic'].map(k=>`<th>${t(k)}</th>`).join('')}</tr></thead><tbody>${['Browser','Terminal','Updater'].map((p,i)=>`<tr><td>${p} · ${t('demo')}</td><td class="mono">service-${i+1}.example.net:443</td><td>${t(route)}</td><td class="mono">${[12.4,1.2,0.6][i]} MB</td></tr>`).join('')}</tbody></table></section>`:`<div class="empty">${t('noTraffic')}<br><button onclick="openControls()">${t('start')}</button></div>`;
if(page==='settings')body=`<section class="panel"><div class="panel-head"><h2>${t('appearance')}</h2></div><div class="panel-body settings-grid"><label class="field">${t('appearance')}<select onchange="if(this.value!==theme)toggleTheme()"><option value="light" ${theme==='light'?'selected':''}>${t('light')}</option><option value="dark" ${theme==='dark'?'selected':''}>${t('dark')}</option></select></label><label class="field">${t('language')}<select onchange="if(this.value!==lang)toggleLanguage()"><option value="zh" ${lang==='zh'?'selected':''}>简体中文</option><option value="en" ${lang==='en'?'selected':''}>English</option></select></label></div></section><div><button onclick="restoreDemo();page='nodes';render()">${t('restore')}</button></div>`;

const intro={groups:'groupIntro',chains:'chainsIntro',routes:'routesIntro',connections:'connectionsIntro',settings:'settingsIntro',help:'helpIntro'};$('main').innerHTML=`<div class="view" data-od-id="${page}-page"><div class="page-head"><div><h1>${t(page)}</h1><p class="small">${t(intro[page])}</p></div><span class="pill">${t('demo')}</span></div>${body}</div>`}
const previewBase=previewState;
previewState=function(s){previewBase(s);if(s==='applyFailure'&&!busy){selected=nodes.find(n=>n.id!==running)?.id;detailOpen=true;render()}};
// Give dynamically created fields and headings inspectable identities as well.
let inspectSerial=0;
function decorate(){document.querySelectorAll('button,input,select,textarea,h1,h2,h3,section,aside').forEach(el=>{if(!el.hasAttribute('data-od-id'))el.setAttribute('data-od-id',el.id||`auto-${el.tagName.toLowerCase()}-${++inspectSerial}`)})}

document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(page!=='nodes'){page='nodes';render()}$('search')?.focus()}if(e.key==='Escape'){if(!$('modal').open){if(!$('logs').hidden)toggleLogs();else if(page==='nodes'&&detailOpen)hideDetail()}const m=$('moreMenu');if(m)m.hidden=true}});
document.addEventListener('click',e=>{const m=$('moreMenu');if(m&&!e.target.closest('.menu-wrap')){m.hidden=true;$('moreButton')?.setAttribute('aria-expanded','false')}});

updateChrome=function(){chromeBase();$('logs').setAttribute('aria-label',t('diagnosticLogs'));document.title='v2rayN · '+t('desktopWorkspace')};

if(typeof window!=='undefined')window.addEventListener('hashchange',readDiagnosticHash);
