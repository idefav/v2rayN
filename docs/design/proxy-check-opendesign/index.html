function setState(s){clearInterval(timer);timer=null;state=s;expanded.clear();runRules=config.rules;if(s==='idle'){done=0;lastTime='';repaired.clear()}else if(s==='running'){done=0;repaired.clear();runExpected=config.expected;runId++;lastTime='';timer=setInterval(()=>{done++;if(done>=rows.length){clearInterval(timer);timer=null;state='partial';lastTime=new Date().toLocaleTimeString('en-GB')}render()},650)}else{done=s==='canceled'?6:rows.length;repaired.clear();if(s==='complete')rows.filter(r=>['public','return'].includes(r.kind)).forEach(r=>repaired.add(r.id));runExpected=config.expected;lastTime=new Date().toLocaleTimeString('en-GB')}render()}
function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.documentElement.dataset.theme=theme;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));document.querySelectorAll('[data-nav]').forEach(el=>{el.innerHTML=icon(el.dataset.nav);el.setAttribute('aria-label',el.dataset.nav==='shield'?t('title'):bi('外壳导航示意','Shell navigation reference'));el.title=el.dataset.nav==='shield'?t('title'):bi('保留的 v2rayN 外壳','Preserved v2rayN shell')});$('theme').innerHTML=icon(theme==='light'?'moon':'sun');$('theme').setAttribute('aria-label',bi('切换浅色或深色主题','Toggle light or dark theme'));$('language').textContent=lang==='zh'?'EN':'中文';$('language').setAttribute('aria-label',bi('切换英文','Switch to Chinese'));$('node-icon').innerHTML=icon('globe');$('notice-icon').innerHTML=icon('info');$('search-icon').innerHTML=icon('search');$('search').placeholder=t('search');$('search').setAttribute('aria-label',t('search'));$('footer-note').innerHTML=icon('lock')+esc(t('footer'));$('open-settings').innerHTML=t('configure')+icon('chevron');$('service-status').textContent=t(config.tested?'connected':'connected');$('run-status').className='pill '+(state==='partial'?'warn':state==='complete'?'good':state==='running'?'blue':'neutral');$('run-status').innerHTML=icon(state==='partial'?'warning':state==='complete'?'check':state==='running'?'activity':'minus')+t(state);$('start').innerHTML=icon(state==='running'?'stop':'play')+t(state==='running'?'cancel':'start');$('retry').innerHTML=icon('retry')+t('retry');$('retry').disabled=state==='running'||!rows.some((r,i)=>['public','return'].includes(result(r,i).kind));$('export').innerHTML=icon('download')+t('export');$('export').disabled=done===0;$('baseline-toggle').innerHTML=icon('baseline')+t('baseline')+(baselineActive?' ✓':'')+icon('down');renderBaseline();$('last-run').textContent=state==='running'?`${t('inProgress')} · ${done}/${rows.length}`:lastTime?`${t('last')} ${lastTime} · ${t('demo')}`:t('noLast');
const rr=rows.map(result);const metrics=[['normal',rr.filter(x=>x.comm==='normal').length,'normalDesc','check','good'],['match',rr.filter(x=>x.comparison==='matched').length,'matchDesc','shield','blue'],['attention',rr.filter(isAttention).length,'attentionDesc','warning','warn'],['notcovered',rr.filter(x=>x.kind==='uncovered').length,'uncoveredDesc','minus','muted']];$('summary').innerHTML=metrics.map(([label,count,desc,ico,tone])=>`<div class="metric"><div class="od-stat"><span class="metric-label">${t(label)}</span><strong class="metric-value ${tone}">${state==='idle'?'—':count}</strong><span class="metric-desc">${t(state==='idle'?'idleSummary':desc)}</span></div><span class="metric-mark ${tone}">${icon(ico)}</span></div>`).join('');$('progress').hidden=state!=='running';$('progress').innerHTML=`<div class="progress-line"><span>${t('inProgress')}</span><span class="mono">${done} / ${rows.length} ${t('completedCount')}</span></div><div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="15" aria-valuenow="${done}"><div class="progress-fill" style="width:${done/rows.length*100}%"></div></div>`;
$('filters').innerHTML=['all','attention','pass','notcovered'].map(f=>`<button class="filter ${filter===f?'active':''}" data-filter="${f}" aria-pressed="${filter===f}">${t(f)} <span class="mono">${f==='all'?rows.length:rr.filter(x=>eligible(x,f)).length}</span></button>`).join('');$('columns').innerHTML=['target','path','communication','actual','compare','time'].map(k=>`<span>${t(k)}</span>`).join('');$('result-count').textContent=rows.length;$('demo-state').innerHTML=['idle','running','partial','complete','canceled'].map(s=>`<option value="${s}" ${s===state?'selected':''}>${t(s)}</option>`).join('');$('close-settings').innerHTML=icon('close');$('close-settings').setAttribute('aria-label',bi('关闭设置','Close settings'));renderRows()}
function renderRows(){let output='',lastGroup='',visible=0;rows.forEach((r,i)=>{let x=result(r,i),runExpected=expectedFor(r);if(!eligible(x,filter)||query&&!`${value(r.name)} ${value(r.target)} ${value(r.path)} ${x.actual} ${t(x.comparison)}`.toLowerCase().includes(query.toLowerCase()))return;visible++;if(r.g!==lastGroup){lastGroup=r.g;output+=`<button class="group-heading" data-group="${r.g}" aria-expanded="${!collapsed.has(r.g)}">${icon(collapsed.has(r.g)?'chevron':'down')}<span>${t(r.g)}</span><small>${rows.filter(a=>a.g===r.g).length}</small><span class="group-caption">${r.g==='DNS'?bi('区分客户端路径与递归解析器','Client path and recursive resolver are distinct'):r.g==='IPv6'?bi('观察能力限制','Observer limitation'):r.g==='networkGroup'?bi('配置与流量分开判定','Configuration and traffic are distinct'):''}</span></button>`}if(collapsed.has(r.g))return;let exp=expanded.has(r.id),ct=x.comparison==='mismatch'?'bad':x.comparison==='matched'?'good':'muted';output+=`<button class="result-row ${exp?'selected':''}" data-row="${r.id}" aria-expanded="${exp}" aria-controls="detail-${r.id}"><span class="row-target">${icon(exp?'down':'chevron')}<span class="od-field"><span class="target-name">${esc(value(r.name))}</span><span class="target-sub">${esc(value(r.target))}</span></span></span><span class="od-field"><span class="path-text">${esc(value(r.path))}</span><span class="path-sub">${esc(value(r.sub))}</span></span><span class="od-field"><span class="comm ${x.tone}">${icon(x.tone==='good'?'check':x.tone==='bad'?'warning':'minus')}${t(x.comm)}</span><span class="samples">${x.sample}${x.sample==='—'?'':bi(' 次响应',' responses')}</span></span><span class="od-field"><span class="egress">${x.actual}</span><span class="evidence-label">${x.actual==='—'?(x.kind==='uncovered'?'IPv4-only':x.kind==='public'?t('publicFail'):''):t(x.kind==='recursive'?'recursive':'signedObservation')}</span></span><span class="od-field"><span class="comparison ${ct}">${t(x.comparison)}</span>${x.kind==='return'?`<span class="evidence-label">${t('received')}</span>`:x.comparison==='matched'?`<span class="evidence-label mono">${esc(runExpected)}</span>`:x.comparison==='mismatch'?`<span class="evidence-label mono">≠ ${esc(runExpected)}</span>`:''}</span><span class="latency">${x.ms===null?'—':x.ms>=1000?(x.ms/1000).toFixed(1)+' s':x.ms+' ms'}</span></button>`;if(exp)output+=detail(r,x,i)});$('result-list').innerHTML=output||`<div class="empty">${icon('search')}<p>${t('noResults')}</p><button class="btn link" data-clear>${t('clearSearch')}</button></div>`;$('visible-count').textContent=bi(`显示 ${visible} / ${rows.length} 项` ,`Showing ${visible} of ${rows.length} checks`)+(state==='canceled'?' · '+t('stopped'):'')}
function detail(r,x,i){let special=['uncovered','unsupported','na','pending'].includes(x.kind);let source=x.kind==='recursive'?bi('权威 DNS 查询日志（设计演示）','Authoritative DNS query log (demo)'):x.kind==='na'?t('localOnly'):x.kind==='public'?bi('公共健康端点，非签名出口证据','Public health endpoint; not signed egress evidence'):special?t('noObservation'):bi('观察端签名回执（设计演示签名，非密码学验证）','Observer receipt (illustrative signature, not cryptographically verified)');let advice=x.kind==='mismatch'?bi('通信已成功，但观测地址不在预期网段内。检查 TUN 接管和分流规则后重试，勿将通信成功视为出口正确。','Connectivity succeeded, but the observation is outside the expected subnet. Review TUN capture and routing rules, then retry.'):x.kind==='public'?bi('公共端点返回 503。先确认服务健康，再更换端点验证；该故障不能证明代理泄漏。','The public endpoint returned 503. Check service health or use another endpoint. This does not establish a proxy leak.'):x.kind==='return'?bi('观察端已收到全部 3 次请求并返回签名观测，但客户端未收到完整响应。检查 QUIC 回程、MTU 和防火墙；发送成功不代表端到端通信成功。','The observer received all 3 requests and emitted signed observations, but the client received no complete response. Review QUIC return traffic, MTU, and firewall rules.'):x.kind==='recursive'?bi('此地址是权威端看到的递归解析器出口，不代表客户端到 DNS 服务的出口。此项不进行客户端出口比较。','This is the recursive resolver address seen by the authoritative server, not client-to-DNS egress. No client egress comparison is made.'):x.kind==='uncovered'?t('v6Limit'):x.kind==='unsupported'?t('httpUnsupported'):x.kind==='na'?t('notApplicable'):x.kind==='pending'?bi('尚无检测证据。开始检查后再判断通信与出口。','No evidence yet. Run a check before evaluating connectivity or egress.'):x.comparison==='observed'?bi('已有签名出口观测，但未配置预期。可在服务设置中添加预期 IP/CIDR 后重新检查。','A signed egress observation exists with no expectation configured. Add an expected IP/CIDR and run again.'):bi('通信与出口分别通过。保留观察端来源、时间与逐次采样，以便后续复现。','Connectivity and egress independently pass. Preserve the observer source, timestamp, and individual samples.');let stage=x.kind==='public'?'HTTP 503':x.kind==='return'?bi('回程 / 响应读取超时','Return path / response read timeout'):special?t('na'):t('none');let baselineText=!baselineActive?t('noBaselineDiff'):baseline.results[r.id]===x.comparison?bi('与基线一致','Same as baseline'):bi('与基线有变化','Changed from baseline');return `<div class="detail" id="detail-${r.id}"><div class="detail-top"><h3 class="detail-title">${t('details')} <span class="muted mono">CHK-${String(i+1).padStart(2,'0')}</span></h3><span class="pill neutral">${t('demo')}</span></div><div class="detail-grid"><dl><dt>${t('source')}</dt><dd>${source}</dd><dt>${t('failureStage')}</dt><dd>${stage}</dd><dt>${t('observedShort')}</dt><dd>${x.kind==='recursive'?t('recursive'):special?t('na'):t('signedObservation')}</dd><dt>${t('expectedShort')}</dt><dd class="mono">${x.comparison==='na'||r.expect==='none'?'—':esc(runExpected)||'—'}</dd><dt>${t('baselineDiff')}</dt><dd>${baselineText}</dd></dl><div><h3 class="detail-title">${t('sampling')}</h3><div class="sample-list">${special?`<div class="small muted">${t(x.kind==='pending'?'queued':x.comm)}</div>`:[1,2,3].map((n)=>`<div class="sample-line"><span class="mono">0${n}</span><span class="${x.tone}">${x.kind==='return'?t('received')+' · '+t('returnFail'):x.kind==='public'?'HTTP 503':t('response')}</span><span class="mono">${x.ms===null?'—':Math.max(1,x.ms+(n-2)*(x.ms>=1000?0:4))+' ms'}</span></div>`).join('')}</div></div></div><p class="suggestion"><strong>${t('suggestion')}：</strong>${advice}</p></div>`}
function renderBaseline(){$('baseline-menu').innerHTML=`<button data-base="save" ${done!==rows.length||state==='running'?'disabled':''}>${icon('baseline')}${t('baselineSave')}</button><hr>${baseline?`<button data-base="use">${icon('check')}${t('baselineUse')} · ${baseline.time}</button>${baselineActive?`<button data-base="clear">${t('baselineClear')}</button>`:''}`:`<p>${t('baselineEmpty')}</p>`}<p>${bi('仅在当前页面内存保存','Kept in page memory only')}</p>`}
$('theme').onclick=()=>{theme=theme==='light'?'dark':'light';render()};$('language').onclick=()=>{lang=lang==='zh'?'en':'zh';render()};$('start').onclick=()=>{if(state==='running'){clearInterval(timer);timer=null;state='canceled';lastTime=new Date().toLocaleTimeString('en-GB');render()}else setState('running')};$('demo-state').onchange=e=>setState(e.target.value);$('filters').onclick=e=>{let b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;render()}};$('search').oninput=e=>{query=e.target.value;renderRows()};$('result-list').onclick=e=>{let row=e.target.closest('[data-row]'),group=e.target.closest('[data-group]');if(row){expanded.has(row.dataset.row)?expanded.delete(row.dataset.row):expanded.add(row.dataset.row);renderRows();document.querySelector(`[data-row="${row.dataset.row}"]`)?.focus({preventScroll:true})}if(group){collapsed.has(group.dataset.group)?collapsed.delete(group.dataset.group):collapsed.add(group.dataset.group);renderRows()}if(e.target.closest('[data-clear]')){filter='all';query='';$('search').value='';render()}};
$('retry').onclick=()=>{let failed=rows.filter((r,i)=>['public','return'].includes(result(r,i).kind));if(!failed.length)return;$('retry').disabled=true;$('retry').innerHTML=icon('clock')+bi('重试中…','Retrying…');setTimeout(()=>{failed.forEach(r=>repaired.add(r.id));state=rows.some((r,i)=>isAttention(result(r,i)))?'partial':'complete';lastTime=new Date().toLocaleTimeString('en-GB');render();toast(bi('已重试通信失败项；出口不匹配需检查规则','Failed connectivity checks retried; review routing for egress mismatches'))},900)};
$('baseline-toggle').onclick=()=>{let open=$('baseline-menu').hidden;$('baseline-menu').hidden=!open;$('baseline-toggle').setAttribute('aria-expanded',open)};document.addEventListener('click',e=>{if(!e.target.closest('.popover-wrap')){$('baseline-menu').hidden=true;$('baseline-toggle').setAttribute('aria-expanded','false')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('baseline-menu').hidden=true;$('baseline-toggle').setAttribute('aria-expanded','false')}});$('baseline-menu').onclick=e=>{let b=e.target.closest('[data-base]');if(!b)return;if(b.dataset.base==='save'){baseline={time:new Date().toLocaleTimeString('en-GB'),expected:runExpected,results:Object.fromEntries(rows.map((r,i)=>[r.id,result(r,i).comparison]))};toast(t('baselineSaved'))}else if(b.dataset.base==='use'){baselineActive=true;config.expected=baseline.expected;toast(t('baselineApplied'))}else{baselineActive=false;toast(t('noBaselineDiff'))}$('baseline-menu').hidden=true;$('baseline-toggle').setAttribute('aria-expanded','false');render()};
const form=$('settings-form');function formConfig(){let fd=new FormData(form);return{endpoint:fd.get('endpoint').trim(),token:fd.get('token'),expected:fd.get('expected').trim(),rules:fd.get('rules'),samples:3,timeout:Number(fd.get('timeout')),http3Timeout:Number(fd.get('http3Timeout'))}}function fillForm(c){Object.entries(c).forEach(([k,v])=>{if(form.elements.namedItem(k))form.elements.namedItem(k).value=v});syncJson()}function syncJson(){let c=formConfig();c.token='••••••••';$('raw-json').value=JSON.stringify(c,null,2)}
$('open-settings').onclick=()=>{fillForm(config);$('settings-feedback').textContent='';$('settings-dialog').showModal()};$('close-settings').onclick=()=>$('settings-dialog').close();$('settings-dialog').addEventListener('click',e=>{if(e.target===$('settings-dialog')){let rect=e.target.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)e.target.close()}});form.addEventListener('input',e=>{if(e.target!==$('raw-json'))syncJson()});form.onsubmit=e=>{e.preventDefault();let c=formConfig();if(!['','198.51.100.7','203.0.113.0/24'].includes(c.expected)){$('settings-feedback').textContent=t('ipError');form.elements.expected.focus();return}config=c;$('settings-dialog').close();render();toast(t('saved'))};$('test').onclick=()=>{let b=$('test');if(!form.elements.endpoint.reportValidity())return;b.disabled=true;b.textContent=t('testing');$('settings-feedback').textContent='';setTimeout(()=>{b.disabled=false;b.textContent=t('testConnection');$('settings-feedback').textContent=t('testOk');$('settings-feedback').style.color='var(--green)'},900)};
function importConfig(c){if(!c||typeof c!=='object'||Array.isArray(c)||typeof c.endpoint!=='string'||!/^https?:\/\//.test(c.endpoint)||!['','198.51.100.7','203.0.113.0/24'].includes(c.expected??'')||c.samples!==undefined&&c.samples!==3||c.timeout!==undefined&&(!Number.isFinite(c.timeout)||c.timeout<1||c.timeout>60)||c.http3Timeout!==undefined&&(!Number.isFinite(c.http3Timeout)||c.http3Timeout<1||c.http3Timeout>60)||c.rules!==undefined&&typeof c.rules!=='string'||c.token!==undefined&&typeof c.token!=='string')throw Error();let current=formConfig();fillForm({...current,endpoint:c.endpoint,expected:c.expected??'',rules:c.rules??current.rules,token:c.token==='••••••••'?current.token:c.token??current.token,samples:3,timeout:c.timeout??5,http3Timeout:c.http3Timeout??10});$('settings-feedback').style.color='var(--green)';$('settings-feedback').textContent=t('imported')}
$('apply-json').onclick=()=>{try{importConfig(JSON.parse($('raw-json').value))}catch{$('settings-feedback').style.color='var(--red)';$('settings-feedback').textContent=t('configError')}};$('import').onclick=()=>$('import-file').click();$('import-file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{importConfig(JSON.parse(await f.text()))}catch{$('settings-feedback').style.color='var(--red)';$('settings-feedback').textContent=t('configError')}e.target.value=''};
$('export').onclick=()=>{let report={project:'v2rayN Proxy Check — Egress Diagnostics',notice:'DESIGN DEMO DATA — no real diagnostics performed',runId,state,time:lastTime,configuration:{endpoint:config.endpoint,expected:runExpected,samples:config.samples,timeout:config.timeout,http3Timeout:config.http3Timeout},results:rows.map((r,i)=>({id:r.id,target:value(r.target),path:value(r.path),...result(r,i)}))};let url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='v2rayN-proxy-check-demo-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(t('reportSaved'))};
// Snapshot per-check expectations in evidence and exports, independently of global defaults.
const renderDetail=detail;
detail=function(r,x,i){const expected=expectedFor(r);const rendered=renderDetail(r,x,i);return rendered.replace(`<dd class="mono">${esc(runExpected)||'—'}</dd>`,`<dd class="mono">${esc(expected)||'—'}</dd>`)};
let runTiming={timeout:5,http3Timeout:10};
const changeState=setState;
setState=function(s){runTiming={timeout:config.timeout,http3Timeout:config.http3Timeout};changeState(s)};
const evaluate=result;
result=function(r,i){let x=evaluate(r,i);if(x.comm==='normal'){if(x.comparison==='mismatch')x.kind='mismatch';else if(x.kind==='mismatch')x.kind='good'}if(x.kind==='public')x.ms=runTiming.timeout*1000;if(x.kind==='return')x.ms=runTiming.http3Timeout*1000;return {...x,expected:expectedFor(r)}};
const renderPage=render;
render=function(){renderPage();document.querySelector('[data-i="sampleConfig"]').textContent=bi(`每项采样 3 次 · 超时 ${runTiming.timeout}s / HTTP3 ${runTiming.http3Timeout}s`,`3 samples per check · Timeout ${runTiming.timeout}s / HTTP3 ${runTiming.http3Timeout}s`)};
const saveForm=form.onsubmit;
form.onsubmit=function(e){if(ruleError(formConfig())){e.preventDefault();$('settings-feedback').style.color='var(--red)';$('settings-feedback').textContent=bi('规则格式：检查 ID → 预期 IP/CIDR，例如 udp-tun → 203.0.113.0/24。','Rule format: check ID → expected IP/CIDR, e.g. udp-tun → 203.0.113.0/24.');form.elements.rules.focus();return}saveForm(e)};
render();
</script>
